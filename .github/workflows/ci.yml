name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_nightly:
        description: "Also run the long full-suite validation tier"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Lint and format
        run: |
          # Read the pin out of pyproject's dev extra rather than repeating it
          # here, so this gate and a local `pip install -e ".[dev]"` can never
          # drift to two different ruff styles.
          pin=$(python -c "import tomllib;print(next(x for x in tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['dev'] if x.startswith('ruff')))")
          python -m pip install "$pin"
          ruff check .
          ruff format --check .

      - name: Repository size manifest
        run: |
          python scripts/check.py size
          python scripts/check.py size release-artifacts
          python scripts/check.py readiness version
          python scripts/check.py architecture
          python scripts/check.py parallel-scaling --performance-manifest-only
          python scripts/check.py parallel-scaling
          python scripts/check.py quasilinear \
            --out-json docs/_static/quasilinear_promotion_guardrails.json
          python scripts/check.py vmec-boozer differentiability-claim \
            --out-json docs/_static/vmec_boozer_differentiability_claim_guard.json
          python scripts/check.py readiness technical-status \
            --out-json docs/_static/technical_release_status.json \
            --fail-under 98
          python scripts/check.py readiness \
            --out-json docs/_static/release_readiness.json

      - name: Tracked release artifacts are up to date
        run: |
          # The step above regenerates four tracked artifacts in place. Every
          # one of those checkers exits 0 on a stale file and simply rewrites
          # it, so until this gate existed the rewrite was thrown away with the
          # runner and staleness was invisible: release_readiness.json,
          # technical_release_status.json and the differentiability guard all
          # still carried version 1.8.2 and one contributor's absolute checkout
          # path days after the 2.0.0 bump in #188. Diffing the regenerated
          # files against the commit is what turns that into a failure.
          if ! git diff --exit-code -- \
            docs/_static/quasilinear_promotion_guardrails.json \
            docs/_static/vmec_boozer_differentiability_claim_guard.json \
            docs/_static/technical_release_status.json \
            docs/_static/release_readiness.json
          then
            echo "::error::Tracked release artifacts are stale. Run the generator commands in the 'Repository size manifest' step above and commit the result."
            exit 1
          fi

  python-floor:
    # Every other job pins 3.11, which is why a stdlib-only-from-3.11 import
    # could sit in twelve modules while pyproject advertised a lower floor. This
    # job runs the declared floor and collects the whole suite: collection is
    # where an import that does not exist on the floor actually fails, and it
    # costs a minute rather than a second full test run. The floor moved to 3.11
    # when the jax minimum did; jax >= 0.10.1 publishes no 3.10 wheels.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          jax-cache: python-floor

      - name: Confirm the floor really is the floor
        run: |
          python - <<'PY'
          import sys, tomllib, gkx
          assert sys.version_info[:2] == (3, 11), sys.version_info
          assert tomllib.loads("a = 1") == {"a": 1}
          print("gkx", gkx.__version__, "on", sys.version)
          PY

      - name: Import the public API and the console entry point
        run: |
          python -c "import gkx; import gkx.cli"
          gkx --help > /dev/null

      - name: Collect the full suite
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          pytest -q --collect-only --disable-warnings > /dev/null

      - name: Default-f32 compressed nonlinear gradient (isolated backend failures)
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "false"
          GKX_X64: "0"
        run: |
          pytest -q -rx tests/unit/nonlinear/test_nonlinear.py \
            -k compressed_real_fft_heat_flux_window_gradient_matches_finite_difference

      - name: Default-f32 nonlinear window-gradient matrix
        # nonlinear-core runs this matrix in float64. Here the float32 adjoint,
        # the documented default, is checked against a float64 centered
        # difference evaluated in the same process, and the blocked checkpoint
        # against the plain reverse pass within float32 roundoff.
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "false"
          GKX_X64: "0"
        run: |
          pytest -q -rf --maxfail=20 tests/unit/nonlinear/test_nonlinear_helpers_extra.py \
            -k "window_gradient_matches_centered_finite_difference or block_checkpointed_window_matches_plain_reverse_pass"

      - name: Portability gates
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          pytest -q --disable-warnings \
            tests/release/test_release_gates.py \
            -k "tomllib or toml_shim or repo_hygiene_gates"

  mypy:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: MyPy (types)
        run: |
          mypy --version
          mypy

  adaptive-eigensolver:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          jax-cache: adaptive-eigensolver

      - name: Paired eigenmode and implicit-AD gates
        env:
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
          # Turn a missing paired API into a collection error. Without this the
          # job passes while skipping every test it exists to run.
          GKX_REQUIRE_PAIRED_SOLVAX: "1"
        run: |
          python -c "import solvax; assert callable(solvax.exponential_eigenpairs); assert callable(solvax.sparse_eigenpairs)"
          pytest -q --maxfail=1 --disable-warnings \
            tests/unit/solvers/test_linear_krylov_core.py \
            tests/unit/objectives/test_autodiff_solver_objectives.py \
            -m "integration or not integration" \
            -k "adaptive or biorthogonal or experimental_solvax_eigen_contract"

  fast-coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          jax-cache: fast-coverage

      - name: Release-surface coverage (>=95%)
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          pytest -q \
            tests/integration/runtime/test_cli.py \
            tests/integration/runtime/test_runtime_artifacts.py \
            tests/unit/nonlinear/test_nonlinear_exb.py \
            tests/unit/diagnostics/test_analysis.py \
            tests/validation/benchmarks/test_benchmarking.py \
            --maxfail=1 --disable-warnings \
            --cov=gkx \
            --cov-report=xml:coverage-fast.xml \
            --cov-report=term
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          thresholds = {
              "cli.py": 95.0,
              "plotting.py": 95.0,
              "workflows/runtime/artifacts.py": 95.0,
              "analysis.py": 95.0,
          }

          root = ET.parse("coverage-fast.xml").getroot()
          found = {}
          for cls in root.findall(".//class"):
              filename = cls.attrib.get("filename", "")
              for target in thresholds:
                  if filename.endswith(target):
                      found[target] = float(cls.attrib["line-rate"]) * 100.0

          missing = [name for name in thresholds if name not in found]
          if missing:
              print(f"Missing coverage entries for: {missing}")
              sys.exit(1)

          failed = []
          for target, threshold in thresholds.items():
              cov = found[target]
              print(f"{target}: {cov:.2f}% (required {threshold:.1f}%)")
              if cov < threshold:
                  failed.append((target, cov, threshold))

          if failed:
              for target, cov, threshold in failed:
                  print(f"FAIL: {target}={cov:.2f}% < {threshold:.1f}%")
              sys.exit(1)
          PY

      - name: Upload fast coverage report
        uses: codecov/codecov-action@v6
        with:
          files: coverage-fast.xml
          flags: fast-surface
          fail_ci_if_error: false  # coverage is gated by our own fail-under steps; a Codecov outage must not block CI
          use_oidc: true

  wide-coverage-shards:
    # The test lane. Every test not marked ``slow`` runs here exactly once, at
    # float64, under coverage; the shards are packed on measured per-file cost
    # by scripts/checks/run_test_gates.py and each runs its files across four
    # pytest-xdist workers, one per runner core. The files that need logical
    # CPU devices get four of them from the same planner. There is no separate
    # uncovered test lane: it ran the same tests a second time.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          jax-cache: wide-${{ matrix.shard }}-of-8

      - name: Wide package coverage shard ${{ matrix.shard }}/8
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          python scripts/check.py test-gates wide-coverage \
            --shards 8 \
            --workers 4 \
            --timeout 1500 \
            --only-shard "${{ matrix.shard }}" \
            --skip-combine \
            --pytest-arg=-o \
            --pytest-arg=addopts= \
            --pytest-arg=-m \
            --pytest-arg="not slow"

      - name: Package coverage shard data
        run: |
          mkdir -p coverage-shard
          python - <<'PY'
          from pathlib import Path
          import shutil

          files = sorted(Path(".").glob(".coverage.*"))
          out = Path("coverage-shard")
          if not files:
              (out / f"EMPTY_SHARD_${{ matrix.shard }}").write_text("empty shard\n", encoding="utf-8")
              raise SystemExit(0)
          for idx, path in enumerate(files):
              shutil.copy2(path, out / f".coverage.shard-${{ matrix.shard }}.{idx}")
          PY
          tar -czf "coverage-wide-shard-${{ matrix.shard }}.tgz" -C coverage-shard .

      - name: Upload coverage shard data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wide-shard-${{ matrix.shard }}
          path: coverage-wide-shard-${{ matrix.shard }}.tgz
          if-no-files-found: error

  wide-coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only remaining ``needs`` in this workflow, and the only real one: this
    # job downloads the ``.coverage`` shard artifacts the matrix above uploads.
    # Every other job checks out and installs for itself, so ordering them
    # bought nothing and cost the signal from everything downstream.
    needs: wide-coverage-shards

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Download wide coverage shard data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-wide-shard-*
          path: coverage-wide-artifacts
          merge-multiple: true

      - name: Combine wide package coverage
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          find coverage-wide-artifacts -name '*.tgz' -print -exec tar -xzf {} \;
          python scripts/check.py test-gates wide-coverage \
            --shards 8 \
            --combine-only \
            --require-shard-data \
            --shard-manifest coverage-wide-shard-manifest.json \
            --fail-under 95 \
            --xml coverage-wide.xml
          python scripts/check.py validation-coverage \
            --coverage-xml coverage-wide.xml \
            --enforce-package-coverage \
            --out-json docs/_static/validation_coverage_manifest_summary.json

      - name: Upload wide coverage shard manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wide-shard-manifest
          path: coverage-wide-shard-manifest.json
          if-no-files-found: ignore

      - name: Upload validation coverage manifest summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-coverage-manifest-summary
          path: docs/_static/validation_coverage_manifest_summary.json
          if-no-files-found: ignore

      - name: Upload wide coverage report
        uses: codecov/codecov-action@v6
        with:
          files: coverage-wide.xml
          flags: wide-package
          fail_ci_if_error: false  # coverage is gated by our own fail-under steps; a Codecov outage must not block CI
          use_oidc: true

  docs-and-packaging:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          jax-cache: docs-and-packaging

      - name: Build docs
        run: |
          python scripts/check.py validation-coverage --out-json docs/_static/validation_coverage_manifest_summary.json
          python scripts/check.py quasilinear calibration-inputs \
            --report docs/_static/quasilinear_cyclone_miller_train_holdout_report.json \
            --report docs/_static/quasilinear_hsx_train_holdout_report.json \
            --report docs/_static/quasilinear_w7x_train_holdout_report.json \
            --report docs/_static/quasilinear_stellarator_train_holdout_report.json \
            --out-json /tmp/quasilinear_validated_calibration_inputs.json \
            --no-plot
          python -m sphinx -W -b html docs docs/_build/html

      - name: Build distribution artifacts
        run: |
          rm -rf build dist
          python -m build

      - name: Check distribution metadata
        run: |
          twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/gkx-wheel-smoke
          /tmp/gkx-wheel-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/gkx-wheel-smoke/bin/python - <<'PY'
          import gkx
          import gkx.parallel
          from importlib.util import find_spec
          from gkx.cli import build_parser

          assert "--plot" in build_parser().format_help()
          assert "batch_map" in gkx.parallel.__all__
          assert gkx.parallel.batch_map.__module__ == "gkx.parallel.independent"
          assert find_spec("gkx.objectives.qa_low_turbulence_contracts") is None
          assert find_spec("gkx.objectives.qa_low_turbulence_residuals") is None
          assert find_spec("gkx.objectives.stellarator_residuals") is None
          assert find_spec("gkx.diagnostics.growth_series") is None
          assert find_spec("gkx.geometry.vmec_boundary_collection") is None
          print(gkx.__version__)
          PY
          /tmp/gkx-wheel-smoke/bin/gkx --help >/dev/null
          /tmp/gkx-wheel-smoke/bin/gkx --help >/dev/null

      # The Phase D gate asks that a fresh user can install and complete a first
      # linear and nonlinear run from the docs. Everything above proves the
      # wheel imports; nothing proved it computes.
      #
      # quickstart.rst opens with bare ``gkx``, described as a short Cyclone
      # linear demo writing five named artifacts, so run exactly that from the
      # installed wheel in an empty directory and require the five files by
      # name (~10 s), then the documented nonlinear command (~38 s).
      #
      # The third documented command, run-runtime-linear on the Cyclone deck,
      # is deliberately NOT here: it is 970 s. It sits in the same quickstart
      # block as the ten-second demo while being a sixteen-minute production
      # run, which is worth fixing in the docs rather than working around here.
      - name: Documented first run from the installed wheel
        run: |
          rm -rf /tmp/gkx-first-run
          mkdir -p /tmp/gkx-first-run
          cd /tmp/gkx-first-run
          /tmp/gkx-wheel-smoke/bin/gkx
          for artifact in \
            gkx_default_linear.toml \
            gkx_default_linear.summary.json \
            gkx_default_linear.timeseries.csv \
            gkx_default_linear.eigenfunction.csv \
            gkx_default_linear.png
          do
            test -s "$artifact" || {
              echo "quickstart.rst promises $artifact; the first run did not write it"
              exit 1
            }
          done
          cd "$GITHUB_WORKSPACE"
          /tmp/gkx-wheel-smoke/bin/gkx run-runtime-nonlinear \
            --config examples/03_nonlinear_tokamak/case_full.toml \
            --steps 50 \
            --out /tmp/gkx-first-run/cyclone_nonlinear.out.nc
          test -s /tmp/gkx-first-run/cyclone_nonlinear.out.nc || {
            echo "quickstart.rst promises a nonlinear output bundle; none was written"
            exit 1
          }

  ci-required:
    # One aggregate check for branch protection to require. The jobs above are
    # now independent, so nothing can hide behind a failed dependency -- but a
    # job that never reported can still read as green: GitHub scores a skipped
    # or cancelled check as satisfied for a required status check, which is how
    # a cancelled run and a mypy-blocked matrix both passed for #62. This job
    # is red unless every gate reported success, so "no signal" is a failure.
    #
    # ``nightly-full`` is deliberately absent: it is skipped by design on
    # pull_request and push.
    if: always()
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
      - python-floor
      - mypy
      - adaptive-eigensolver
      - fast-coverage
      - wide-coverage-shards
      - wide-coverage
      - docs-and-packaging

    steps:
      - name: Every gate must have reported success
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "gate results: ${{ join(needs.*.result, ' ') }}"
          echo "A required gate did not succeed. A skipped or cancelled gate is not a pass."
          exit 1

  nightly-full:
    if: github.event_name == 'workflow_dispatch' && inputs.run_nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: MyPy (types)
        run: |
          mypy --version
          mypy

      # The per-PR docs job builds with -W, which catches broken internal
      # references but never resolves an external URL. The docs cite ~86 of
      # them, almost all papers, so link rot is a real way for the reference
      # list to go stale silently. This is not a pull-request gate: it depends
      # on other people's servers, so it belongs on the nightly lane where red
      # means "look at it" rather than "your change is broken".
      #
      # Only 404 and 410 fail. A first pass over these docs returned 27
      # "broken" links of which 23 were 403 from AIP, APS, SIAM, MDPI and ACM
      # -- publishers refusing an unattended client, not dead references; every
      # one of those DOIs resolves in a browser. Failing on them would have
      # made this job permanently red and taught everyone to ignore it. The
      # four real ones were three DOIs that 404 at doi.org itself (they were
      # simply wrong) and a link to an unpublished branch; all four are fixed
      # in this change. Anything that is neither clearly gone nor clearly fine
      # is printed for a human instead of failing the run.
      - name: Docs link policy
        run: |
          python -m sphinx -b linkcheck docs docs/_build/linkcheck || true
          python - <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("docs/_build/linkcheck/output.json")
          if not report.exists():
              sys.exit("linkcheck produced no report")
          rows = [
              json.loads(line)
              for line in report.read_text().splitlines()
              if line.strip()
          ]
          gone, unverified = [], []
          for row in rows:
              if row.get("status") != "broken":
                  continue
              where = f"{row.get('filename')}:{row.get('lineno')} {row.get('uri')}"
              info = str(row.get("info", ""))
              if "404" in info or "410" in info:
                  gone.append(f"{where} -- {info}")
              else:
                  unverified.append(f"{where} -- {info}")
          if unverified:
              print(f"{len(unverified)} links could not be verified "
                    "(403/429/timeout -- usually a publisher refusing robots):")
              print("\n".join(f"  {item}" for item in unverified))
          if gone:
              print(f"\n{len(gone)} links are gone (404/410):")
              print("\n".join(f"  {item}" for item in gone))
              sys.exit(f"{len(gone)} dead documentation links")
          print(f"\nno dead links; {len(rows)} checked")
          PY

      - name: Pytest (full suite)
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          pytest -q --maxfail=1 --disable-warnings

      - name: Core Terms Coverage (>=90%)
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          pytest -q \
            tests/unit/operators/test_terms_fields.py \
            tests/unit/solvers/test_time_integrators.py \
            tests/unit/nonlinear/test_nonlinear_exb.py \
            tests/unit/nonlinear/test_nonlinear.py \
            --maxfail=1 --disable-warnings \
            --cov=src/gkx/terms \
            --cov-fail-under=90

      - name: Krylov Core Coverage (>=90%)
        env:
          MPLBACKEND: Agg
          JAX_ENABLE_X64: "true"
          GKX_X64: "1"
        run: |
          pytest -q \
            tests/unit/solvers/test_linear_krylov_core.py \
            --maxfail=1 --disable-warnings \
            --cov=src/gkx \
            --cov-report=xml:coverage-core.xml \
            --cov-report=term
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          thresholds = {
              "linear_krylov.py": 90.0,
          }

          root = ET.parse("coverage-core.xml").getroot()
          found = {}
          for cls in root.findall(".//class"):
              filename = cls.attrib.get("filename", "")
              for target in thresholds:
                  if filename.endswith(target):
                      found[target] = float(cls.attrib["line-rate"]) * 100.0

          missing = [name for name in thresholds if name not in found]
          if missing:
              print(f"Missing coverage entries for: {missing}")
              sys.exit(1)

          failed = []
          for target, threshold in thresholds.items():
              cov = found[target]
              print(f"{target}: {cov:.2f}% (required {threshold:.1f}%)")
              if cov < threshold:
                  failed.append((target, cov, threshold))

          if failed:
              for target, cov, threshold in failed:
                  print(f"FAIL: {target}={cov:.2f}% < {threshold:.1f}%")
              sys.exit(1)
          PY
