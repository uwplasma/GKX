[pytest]
testpaths = tests
# The default deselection is ``slow``, not ``integration``. Deselecting
# ``integration`` meant a bare ``pytest`` collected nothing at all from
# tests/unit/linear/test_linear.py, tests/unit/nonlinear/test_nonlinear.py and
# tests/integration/runtime/test_runtime_runner.py -- the published gyro-moment
# hierarchy check, the collision free-energy identities, and the finite-
# difference gradient contracts -- so the physics only ever ran in the wide
# coverage matrix, which clears addopts. ``slow`` is the marker that actually
# means "do not pay for this in a routine local loop", and it is the same
# filter the wide coverage shards apply, so the local default and the CI
# package-coverage lane now select the same set.
addopts = -q --maxfail=1 --disable-warnings -m "not slow"
markers =
    gpu: tests that require or exercise GPU/device-specific execution paths
    integration: broader end-to-end or workflow tests
    slow: long-running literature or artifact validation tests kept out of bounded release coverage shards
