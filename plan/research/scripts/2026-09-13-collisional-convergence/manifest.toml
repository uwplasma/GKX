# Q8 collisional Laguerre convergence of the Cyclone ky=.55 growth rate
# (registered 2026-09-13 before any run; executed 2026-09-13/14 on office, see
# plan/log.md. The T=300 variants at the end were added at 19:07 CDT.)
#
# Question: is the Nl-converged linear growth rate of this mode ~.017 once a
# small physical collision frequency regularizes the Hermite-Laguerre
# truncation, with the collisionless runs converging slowly toward it from
# above, and does GX agree with a matched collisional run?
# Predictions:
#  P1 for each nu in {1e-3, 3e-3, 1e-2}: |gamma(Nl48) - gamma(Nl32)|/gamma < 2%,
#     the three gamma(Nl48) agree within a few %, and extrapolate smoothly as
#     nu -> 0;
#  P2 collisionless gamma(Nl64) < gamma(Nl48) and moves toward that limit;
#  P3 a conserving Dougherty operator at nu=3e-3, Nl32 gives gamma within 2% of
#     the built-in term (no runtime-selectable Dougherty on main; see the P3 note);
#  P4 GX with vnewk=1e-2 at Nl 24/32 agrees with the matched GKX runs to <= 2%.
#
# Settings are identical to Q3 (plan/research/scripts/2026-09-13-drift-ablation,
# branch evidence/laguerre-drift-ablation): Nm96, Nz96 (ntheta32, nperiod2),
# nkx=1, ky=.550000011920929, rk4, dt=.002, steps=75000 (T=150), fit
# [105,150] (fit_start_fraction .7), half-time probe [52.5,75], absorber
# damp_ends_amp/dt = 50, f64. Only [[species]] nu differs from the tracked
# fixture. Collision term with [time] collision_operator unset ("none"): the
# built-in model, NOT a purely diagonal Lenard-Bernstein term. Its damping is
# nu*(nu_laguerre*l + nu_hermite*m + b) = nu*(2l + m + b)
# (src/gkx/operators/linear/cache_arrays.py:54-57 lb_lam, :197-229
# collision_damping), plus conserving u_perp (m=0), u_par (m=1) and temperature
# (m=0, m=2) restoring terms (src/gkx/operators/linear/dissipation.py:293-325
# _collision_moment_correction, :460-491 collisions_contribution), which
# src/gkx/terms/assembly.py:188-198 applies by passing G, Jl, JlB and b. Same
# structure as GX's rhs_linear (device_funcs.cu -(nu)(b+2l+m)H and the
# conservation_terms u_par/u_perp/t_bar), read from source, not compared
# numerically.
# Run with tools/comparison/build_gx_parity_matrix.py and GX_PARITY_REF_DIR at
# the directory holding ITG_cyclone/itg_salpha_adiabatic_electrons.out.nc
# (geometry import and comparison column only; that reference is GX Nl16/Nm48
# collisionless, so the runner's comparison column is not a matched control).
#
# Reuse: origin/main 578b97074 has no change under src/, tools/, tests/ or
# pyproject.toml since Q3's 06606e404, so Q3's nu1e-3/nu1e-2 x Nl24/Nl32
# results are reused and are not listed here.

[[case]]
key = "preflight-nu3e-3-nl24"
label = "preflight, species nu=3e-3, Nl24, 500 steps"
device = "tokamak"
drive = "ITG"
electrons = "adiabatic"
field_model = "electrostatic"
geometry = "s-alpha analytic"
config = "plan/research/scripts/2026-09-13-collisional-convergence/cyclone_salpha_itg_nu3e-3.toml"
reference_output = "ITG_cyclone/itg_salpha_adiabatic_electrons.out.nc"
reference_provenance = "preflight only"
Nl = 24
Nm = 96
ky = [0.550000011920929]
damp_ends_rate = 50.0
dt = 0.002
steps = 500
method = "rk4"
fit_start_fraction = 0.7

