# P3 control. GKX has no runtime-selectable Dougherty operator
# (COLLISION_OPERATOR_NAMES, src/gkx/operators/linear/params.py:451-458); the
# lead chose collision_operator = "sugama" at nu=3e-3, Nl32, to run only if a
# CPU preflight showed it resolves on an Nl32 x Nm96 state and changes the RHS.
# Result (preflight_collisions.stdout.txt): REJECTED. The Sugama matrix is the
# fixed 8-moment (Nl*Nm = 8) truncation and _check_moment_basis_matches_operator
# (src/gkx/solvers_time_runners.py:85-115) raises for Nl*Nm = 3072; on its own
# 2 x 4 basis it resolves and changes the RHS. The 75000-step Sugama run was
# therefore not registered for execution. The runner-path preflight below was
# run on CPU only, to show the same rejection through the parity runner.

[[case]]
key = "preflight-sugama-nu3e-3-nl32"
label = "preflight, sugama operator, nu=3e-3, Nl32, 500 steps"
device = "tokamak"
drive = "ITG"
electrons = "adiabatic"
field_model = "electrostatic"
geometry = "s-alpha analytic"
config = "plan/research/scripts/2026-09-13-collisional-convergence/cyclone_salpha_itg_nu3e-3_sugama.toml"
reference_output = "ITG_cyclone/itg_salpha_adiabatic_electrons.out.nc"
reference_provenance = "preflight only"
Nl = 32
Nm = 96
ky = [0.550000011920929]
damp_ends_rate = 50.0
dt = 0.002
steps = 500
method = "rk4"
fit_start_fraction = 0.7

