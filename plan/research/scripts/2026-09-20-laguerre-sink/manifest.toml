venv = "/home/rjorge/venvs/gkx-nl"
x64 = true
branch = "evidence/laguerre-sink"
base = "origin/main 38d7c4277"

[deck]
file = "cyclone_salpha_itg_sink.toml"
ky = 0.55
Nm = 96
Nz = 96
ntheta = 32
nperiod = 2
Nx = 1
boundary = "linked"
