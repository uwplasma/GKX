# Q28 declared Laguerre sink (2026-09-20): byte copy of Q16's eigen deck
# (plan/research/scripts/2026-09-18-eigen-laguerre-spectrum/cyclone_salpha_itg_eigen.toml)
# apart from this header, so a sink rung and a Q16 rung differ only by the
# [collisions] overrides sink_spectrum.py applies (hypercollisions_const = 1.0,
# nu_hyper_l, p_hyper_l, nu_hyper_m_const = 0.0). The block below is the
# UNREGULARIZED baseline: kz-branch Hermite hypercollisions at GX's contract,
# no Laguerre channel.
#
# Q16 header follows.
# Q16 eigen Laguerre spectrum (2026-09-18): copy of Q8's deck
# (plan/research/scripts/2026-09-13-collisional-convergence/cyclone_salpha_itg_nu1e-3.toml,
# itself tools/comparison/fixtures/parity/cyclone_salpha_itg.toml) with two changes:
#   [[species]] nu = 0.0 (eigen_spectrum.py overrides it per case from --nu), and
#   [time] damp_ends_rate = 50.0, which pins the end-damping strength the Q8 time
#   runs used (amplitude 0.1 / dt 0.002 = 50). Without it a timestep-free eigensolve
#   would apply amplitude 0.1 as a rate (LinearParams.end_damping_strength), i.e. a
#   different operator from the one Q8 integrated.
# Cyclone ITG, s-alpha geometry, adiabatic electrons.
#
# Physics contract transcribed from the reference-code input deck
#   benchmarks/linear/ITG_cyclone/itg_salpha_adiabatic_electrons.in
# Geometry is imported from that deck's own output so both codes integrate the
# same geometric coefficients. Set GX_PARITY_REF_DIR to the directory holding
# the reference outputs before running.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1
Ny = 34
Nz = 96
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 20.0
ntheta = 32
nperiod = 2

[time]
t_max = 10.0
dt = 0.002
method = "imex2"
sample_stride = 2
damp_ends_rate = 50.0

[geometry]
model = "eik"
geometry_file = "$GX_PARITY_REF_DIR/ITG_cyclone/itg_salpha_adiabatic_electrons.out.nc"

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
beta = 0.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.55
Nl = 16
Nm = 96
solver = "krylov"
