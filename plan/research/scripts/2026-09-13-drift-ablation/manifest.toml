# ---------------------------------------------------------------------------
# Lead change, 2026-09-13 ~15:58 (documented deviation). gradb0_nl24 showed that
# removing the grad-B drift removes the toroidal ITG itself (omega .50 -> .03,
# unsettled), so drift ablations cannot discriminate truncation effects on this
# mode. The two registered curvature=0 cases were SKIPPED (never started).
# Replacement, mode-preserving discriminators at the same T=150 settings:
# physical collisions via [[species]] nu in {1e-3, 1e-2} x Nl {24, 32}, with the
# fixture's built-in operator ([time] collision_operator unset = "none", the
# diagonal Lenard-Bernstein term with [collisions] nu_hermite=1, nu_laguerre=2),
# then one collisionless full-terms Nl48 run. Registered prediction under a
# truncation-reflection mechanism: the Nl24->32 gamma gap shrinks strongly with
# nu, and gamma(nu) extrapolates smoothly toward the collisionless value.

[[case]]
key = "nu1e-3_nl24"
label = "Cyclone ITG s-alpha, species nu=1e-3, Nl24"
device = "tokamak"
drive = "ITG"
electrons = "adiabatic"
field_model = "electrostatic"
geometry = "s-alpha analytic"
config = "plan/research/scripts/2026-09-13-drift-ablation/cyclone_salpha_itg_nu1e-3.toml"
reference_output = "ITG_cyclone/itg_salpha_adiabatic_electrons.out.nc"
reference_provenance = "GX Nl16 Nm48 collisionless shipped-deck reference; comparison column not a matched control"
Nl = 24
Nm = 96
ky = [0.550000011920929]
damp_ends_rate = 50.0
dt = 0.002
steps = 75000
method = "rk4"
fit_start_fraction = 0.7

