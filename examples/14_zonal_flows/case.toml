schema_version = 1

# Rosenbluth-Hinton zonal-flow protocol (Phys. Plasmas 5, 1998; Frei et al., Phys. Plasmas 29,
# 093902, 2022, Fig. 12): ky = 0, kx rho_i = 0.05, adiabatic electrons, q = 1.4, s_hat = 0.5,
# epsilon = 0.1, an initial ion density perturbation uniform along the line, no gradients.
# Tutorial resolution (Nl, Nm) = (6, 16), Nz = 16 and 150 time units: the GAM-averaged residual
# is within 10% of the formula 1 / (1 + 1.6 q^2 / sqrt(epsilon)) = 0.0916.
# benchmarks/cases/collisional_zonal_response.toml is the 600-time-unit deck.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 0.0
fprim = 0.0
nu = 0.0
kinetic = true

[grid]
Nx = 3
Ny = 1
Nz = 16
Lx = 125.66370614359172
Ly = 6.283185307179586
boundary = "periodic"

[time]
# Off: ky = 0 zonal chains carry no end damping.
damp_ends_rate = 0.0
t_max = 150.0
dt = 0.01
method = "rk2"
sample_stride = 10
fixed_dt = true

[geometry]
model = "miller"
rhoc = 0.277778
q = 1.4
s_hat = 0.5
epsilon = 0.1
R0 = 2.77778
R_geo = 2.77778
shift = 0.0
akappa = 1.0
akappri = 0.0
tri = 0.0
tripri = 0.0
betaprim = 0.0

[init]
init_field = "density"
init_amp = 1.0e-6
gaussian_init = false
init_single = true

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = false
hypercollisions = false

[collisions]
nu_hermite = 0.0
nu_laguerre = 0.0
nu_hyper = 0.0
hypercollisions_const = 0.0
hypercollisions_kz = 0.0

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 0.0
collisions = 1.0
hypercollisions = 0.0
hyperdiffusion = 0.0
end_damping = 0.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.0
kx = 0.05
Nl = 6
Nm = 16
solver = "time"
