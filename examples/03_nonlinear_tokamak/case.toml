schema_version = 1

# Cyclone base case nonlinear ITG, tutorial resolution: a 16x16x16 box with
# (Nl, Nm) = (2, 4) and 200 fixed steps. Seconds on a laptop CPU; the run shows
# the linear growth phase and the onset of the nonlinear transfer, not a
# saturated heat flux. case_full.toml is the 64x64x24 production deck.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
kinetic = true

[grid]
Nx = 16
Ny = 16
Nz = 16
Lx = 176.25000339052914
Ly = 62.8
boundary = "linked"
y0 = 28.2
ntheta = 16
nperiod = 1

[time]
t_max = 10.0
dt = 0.05
method = "rk3"
sample_stride = 10
diagnostics_stride = 10
fixed_dt = true
# A fixed tutorial horizon, not a run to saturation.
run_to = "t_max"
compressed_real_fft = true
laguerre_nonlinear_mode = "grid"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-3
init_single = false
random_seed = 22
gaussian_init = false
kpar_init = 0.0

[physics]
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
linear = false
nonlinear = true
beta = 0.0

[collisions]
D_hyper = 0.05
p_hyper_kperp = 2.0
hypercollisions_const = false
hypercollisions_kz = true
p_hyper = 2
p_hyper_m = 4
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[terms]
nonlinear = 1.0
hyperdiffusion = 1.0
hypercollisions = 1.0
end_damping = 1.0

[normalization]
contract = "cyclone"
diagnostic_norm = "rho_star"

[run]
ky = 0.3
Nl = 2
Nm = 4
steps = 200
