schema_version = 1

# Cyclone base case nonlinear ITG, tutorial resolution: a 16x16x16 box with
# (Nl, Nm) = (2, 4) and 200 fixed steps. The run shows
# the linear growth phase and the onset of the nonlinear transfer, not a
# saturated heat flux. case_full.toml is the 64x64x24 production deck.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
kinetic = true

[grid]
Nx = 16  # radial points = kx modes, spacing 2 pi/Lx = 0.0356; 16 is a tutorial size, production runs use 64-96 (docs/guidance.rst)
Ny = 16  # binormal points: 9 ky rows in steps of 0.0355; production runs use 64-96 (docs/guidance.rst)
Nz = 16  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 48 points
Lx = 176.25000339052914  # radial box length in rho_i; kx spacing 2 pi/Lx = 0.0356
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "linked"  # twist-and-shift parallel boundary (links kx rows when Nx > 1)
y0 = 28.2  # ky spacing 1/y0 = 0.0355, the lowest finite ky
ntheta = 16  # points per poloidal turn; the z grid has 48 points
nperiod = 2  # line of 2*nperiod - 1 = 3 turns

[time]
# Optional runtime controls; intervals use normalized time, like t_max.
# chunk_steps = 128  # Defaults: 128 explicit steps, 32 adaptive IMEX steps.
# diagnostics_interval = 0.5  # Overrides the step-stride cadence.
t_max = 10.0  # end time in a/v_ti; a fixed tutorial horizon, not a saturated state
sample_stride = 10  # steps between stored samples
diagnostics_stride = 10  # steps between diagnostic rows
# A fixed tutorial horizon, not a run to saturation.
run_to = "t_max"
compressed_real_fft = true
laguerre_nonlinear_mode = "grid"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-3
init_single = false
random_seed = 22
gaussian_init = false
kpar_init = 0.0

[physics]
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
linear = false
nonlinear = true
beta = 0.0

[collisions]
D_hyper = 0.05
p_hyper_kperp = 2.0
hypercollisions_const = false
hypercollisions_kz = true
p_hyper = 2
p_hyper_m = 4
damp_ends_widthfrac = 0.125

[terms]
nonlinear = 1.0
hyperdiffusion = 1.0
hypercollisions = 1.0
end_damping = 1.0

[normalization]
contract = "cyclone"
diagnostic_norm = "rho_star"

[run]
ky = 0.3  # k_y rho_i of the selected mode, the nearest dealiased row (spacing 0.0355)
Nl = 2  # Laguerre moments (v_perp); default 4; tutorial size
Nm = 4  # Hermite moments (v_par); default 8; tutorial size

[output]
# Optional saved-record cadence in the same time units as time.t_max.
# time_interval = 1.0  # nsave and nstep_restart keep step-based checkpoints.
