schema_version = 1


# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
kinetic = true

[grid]
Nx = 64
Ny = 64
Nz = 24
Lx = 176.25000339052914
Ly = 62.8
boundary = "linked"
y0 = 28.2
ntheta = 24
nperiod = 1

[time]
# Optional runtime controls; intervals use normalized time, like t_max.
# chunk_steps = 128  # Defaults: 128 explicit steps, 32 adaptive IMEX steps.
# diagnostics_interval = 0.1  # Overrides the step-stride cadence.
t_max = 20.4
sample_stride = 10
diagnostics_stride = 10
compressed_real_fft = true
laguerre_nonlinear_mode = "grid"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-3
init_single = false
random_seed = 22
gaussian_init = false
kpar_init = 0.0

[physics]
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
linear = false
nonlinear = true
beta = 0.0

[collisions]
D_hyper = 0.05
p_hyper_kperp = 2.0
hypercollisions_const = false
hypercollisions_kz = true
p_hyper = 2
p_hyper_m = 4
damp_ends_widthfrac = 0.125

[terms]
nonlinear = 1.0
hyperdiffusion = 1.0
hypercollisions = 1.0
end_damping = 1.0

[normalization]
contract = "cyclone"
diagnostic_norm = "rho_star"

[run]
ky = 0.3
Nl = 4
Nm = 8
steps = 200

[output]
# Optional saved-record cadence in the same time units as time.t_max.
# time_interval = 0.2  # nsave and nstep_restart keep step-based checkpoints.
