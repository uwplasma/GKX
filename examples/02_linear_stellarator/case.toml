schema_version = 1

# Linear ITG in the quasi-helically symmetric HSX-like equilibrium of
# Nuhrenberg & Zille (1988), tutorial resolution. The flux-tube geometry is
# sampled from a VMEC wout at s = 0.64 through booz_xform_jax; run.py
# generates the wout with vmex when it is missing. Adiabatic electrons.
# case_full.toml is the 96x96x48 quasilinear-audit deck.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.01
kinetic = true

[grid]
Nx = 1  # radial points = kx modes; 1 = single kx = 0 row. A VMEC tube couples kx rows: gamma at ky 0.4 is 0.1016 here, 0.1092 at Nx = 16 and 0.1100 at Nx = 32 with fix aspect (qualitative; case_full uses Nx = 96)
Ny = 12  # binormal points: 7 ky rows, 0 to 1.2 in steps of 0.2; [run] ky picks one
Nz = 36  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 36 points
Lx = 62.8  # radial box length in rho_i; unused at Nx = 1 (the kx spacing is 2 pi/Lx)
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "linked"  # twist-and-shift parallel boundary (links kx rows when Nx > 1)
y0 = 5.0  # ky spacing 1/y0 = 0.2, the lowest finite ky
ntheta = 12  # points per poloidal turn; the z grid has 36 points (48 per turn for converged rates, docs/guidance.rst)
nperiod = 2  # supplies the VMEC line length npol = 2*nperiod - 1 = 3 turns (npol unset)

[time]
# Read only by a time-route run. The growth rate comes from solver = "krylov" below: 20 time
# units are too short for a fit here (27 to 380% off at ky 0.2 to 0.6).
t_max = 20.0  # end time in a/v_ti; unused by solver = krylov
dt = 0.01  # fixed step in a/v_ti; 2000 steps to t_max
method = "rk4"  # explicit 4th-order Runge-Kutta
sample_stride = 1  # steps between stored samples; 2000 samples
fixed_dt = true  # true = constant dt; false = the CFL controller picks it

[geometry]
model = "vmec"
# Generate this file with:
#   cd examples/vmec && vmex input.NuhrenbergZille_1988_QHS
# For exact HSX validation, override with the benchmark HSX wout.
vmec_file = "../vmec/wout_NuhrenbergZille_1988_QHS.nc"
torflux = 0.64
alpha = 0.0

[init]
init_field = "density"
init_amp = 1e-3
gaussian_init = false

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
D_hyper = 0.05
damp_ends_widthfrac = 0.125

[normalization]
contract = "kinetic"
diagnostic_norm = "none"
flux_scale = 1.0

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
hyperdiffusion = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[run]
Nl = 2  # Laguerre moments (v_perp); default 12; tutorial size
Nm = 4  # Hermite moments (v_par); default 24; tutorial size
solver = "krylov"  # certified eigenpair: no fit window to settle
