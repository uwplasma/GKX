schema_version = 1

# Linear ITG in the quasi-helically symmetric HSX-like equilibrium of
# Nuhrenberg & Zille (1988), tutorial resolution. The flux-tube geometry is
# sampled from a VMEC wout at s = 0.64 through booz_xform_jax; run.py
# generates the wout with vmex when it is missing. Adiabatic electrons.
# case_full.toml is the 96x96x48 quasilinear-audit deck.
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.01
kinetic = true

[grid]
Nx = 1
Ny = 12
Nz = 32
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 5.0
ntheta = 32
nperiod = 1

[time]
t_max = 20.0
dt = 0.01
method = "rk4"
sample_stride = 1
fixed_dt = true

[geometry]
model = "vmec"
# Generate this file with:
#   cd examples/vmec && vmex input.NuhrenbergZille_1988_QHS
# For exact HSX validation, override with the benchmark HSX wout.
vmec_file = "../vmec/wout_NuhrenbergZille_1988_QHS.nc"
torflux = 0.64
alpha = 0.0
npol = 1.0

[init]
init_field = "density"
init_amp = 1e-3
gaussian_init = false

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
D_hyper = 0.05
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "kinetic"
diagnostic_norm = "none"
flux_scale = 1.0

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
hyperdiffusion = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[run]
Nl = 2
Nm = 4
solver = "time"
