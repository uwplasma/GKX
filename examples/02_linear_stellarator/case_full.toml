schema_version = 1

# HSX linear quasilinear transport diagnostic example.
# This mirrors the adiabatic-electron HSX nonlinear validation setup, but runs a
# bounded linear spectrum used for quasilinear calibration audits. The
# uncalibrated mixing-length output is a model diagnostic and must be compared
# against nonlinear windows before making absolute-flux claims.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.01
kinetic = true

[grid]
Nx = 96
Ny = 96
Nz = 48
Lx = 62.8
Ly = 62.8
boundary = "fix aspect"
y0 = 21.0
ntheta = 48
nperiod = 1

[time]
# Unused by the Krylov solver below; the time route needs t_max of several hundred.
t_max = 2.0
dt = 0.005
method = "rk4"
sample_stride = 1
fixed_dt = true

[geometry]
model = "vmec"
# Generate this file with:
#   cd examples/vmec && vmex input.NuhrenbergZille_1988_QHS
# For exact HSX validation, override with the benchmark HSX wout.
vmec_file = "../vmec/wout_NuhrenbergZille_1988_QHS.nc"
torflux = 0.64
alpha = 0.0
# Short field line: growth rates are not converged below npol = 3; see docs/guidance.rst.
npol = 1.0

[init]
init_field = "density"
init_amp = 1e-3
gaussian_init = false

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
D_hyper = 0.05
damp_ends_widthfrac = 0.125

[normalization]
contract = "kinetic"
diagnostic_norm = "none"
flux_scale = 1.0

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
hyperdiffusion = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[output]
path = "tools_out/hsx_quasilinear"

[quasilinear]
enabled = true
mode = "saturated"
saturation_rule = "mixing_length"
amplitude_normalization = "phi_rms"
kperp_average = "phi_weighted"
csat = 1.0
gamma_floor = 0.0
include_stable_modes = false
channels = ["es"]

[run]
# ky = 8/21 is unstable; the lowest ky, 1/21, is damped (gamma = -0.04). solver = "krylov" certifies the
# eigenpair in about two minutes on a CPU (gamma = 0.0837, omega = 0.0783). The time
# route beats two modes: gamma is 0.0775 at t_max = 150 and 0.0814 at 250, and
# Nx = 32 or 48 gives 0.0747 or 0.0819, so the radial grid stays at 96.
ky = 0.38095238095238093
Nl = 4
Nm = 8
solver = "krylov"
