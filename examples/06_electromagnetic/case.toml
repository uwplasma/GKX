schema_version = 1

# Electromagnetic Cyclone case: A_parallel at beta = 0.015 with kinetic ions and
# adiabatic electrons, tutorial resolution (seconds on a laptop CPU). This is
# the electromagnetic ITG branch; the kinetic ballooning mode needs kinetic
# electrons and Nm = 48, which is case_full.toml (Nz = 96, Nl = 16, Nm = 48).

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0
ntheta = 16
nperiod = 2

[time]
t_max = 80.0  # about 8 e-folds at ky 0.3
dt = 0.01  # initial step; the CFL controller sets the rest
method = "rk4"
fixed_dt = false
sample_stride = 2

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "all"
init_amp = 1e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = false
adiabatic_electrons = true
tau_e = 1.0
adiabatic_ions = false
beta = 0.015
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_widthfrac = 0.125

[normalization]
contract = "kbm"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3
Nl = 4
Nm = 8
solver = "time"
