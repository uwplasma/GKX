schema_version = 1

# Electromagnetic Cyclone case with kinetic electrons and A_parallel at
# beta = 0.015, the kinetic-ballooning-mode (KBM) benchmark, at tutorial
# resolution. The deck exercises the electromagnetic path in seconds; Nm = 4
# cannot resolve the KBM, so its growth rate is not physical.
# case_full.toml is the benchmark deck (Nz = 96, Nl = 16, Nm = 48).

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[[species]]
name = "electron"
charge = -1.0
mass = 0.00027
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0
ntheta = 16
nperiod = 1

[time]
t_max = 2.0
dt = 0.001
method = "imex2"
sample_stride = 2

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "all"
init_amp = 1e-10
gaussian_init = true
gaussian_width = 0.5
init_electrons_only = true

[physics]
linear = true
nonlinear = false
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = false
adiabatic_electrons = false
adiabatic_ions = false
beta = 0.015
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "kbm"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3
Nl = 2
Nm = 4
solver = "time"
