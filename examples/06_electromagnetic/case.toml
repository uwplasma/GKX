schema_version = 1

# Electromagnetic Cyclone case: A_parallel at beta = 0.015 with kinetic ions and
# adiabatic electrons at tutorial resolution. This is
# the electromagnetic ITG branch; the kinetic ballooning mode needs kinetic
# electrons and Nm = 48, which is case_full.toml (Nz = 96, Nl = 16, Nm = 48).
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1  # radial points = kx modes; 1 = the single kx = 0 mode, right for a linear run (nonlinear needs a radial box)
Ny = 12  # binormal points: 7 ky rows, 0 to 0.6 in steps of 0.1; [run] ky picks one
Nz = 16  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 48 points
Lx = 62.8  # radial box length in rho_i; unused at Nx = 1 (the kx spacing is 2 pi/Lx)
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "linked"  # twist-and-shift parallel boundary (links kx rows when Nx > 1)
y0 = 10.0  # ky spacing 1/y0 = 0.1, the lowest finite ky
ntheta = 16  # points per poloidal turn; the z grid has 48 points
nperiod = 2  # line of 2*nperiod - 1 = 3 turns; linear linked runs need nperiod >= 2 (docs/guidance.rst)

[time]
t_max = 80.0  # about 8 e-folds at ky 0.3
dt = 0.01  # the run warns when ky or beta push it past the CFL-stable step (0.0085 at ky 0.6)
# rk2 at a fixed step: gamma within 0.1% of the eigensolver and of rk4 + CFL, in 0.5x the
# time of rk4 + CFL (docs/guidance.rst, Linear time stepping).
method = "rk2"  # explicit 2nd-order Runge-Kutta
sample_stride = 2  # steps between stored samples; 4000 samples

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "all"
init_amp = 1e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = false
adiabatic_electrons = true
tau_e = 1.0
adiabatic_ions = false
beta = 0.015
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_widthfrac = 0.125

[normalization]
contract = "kbm"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3  # k_y rho_i of the single mode, the nearest grid row (spacing 0.1)
Nl = 4  # Laguerre moments (v_perp); default 12; tutorial size
Nm = 8  # Hermite moments (v_par); default 24; tutorial size
solver = "time"  # fit a time run
