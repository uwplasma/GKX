schema_version = 1


# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.01
kinetic = true

[grid]
Nx = 96  # radial points = kx modes, spacing 2 pi/Lx = 0.1; production range 64-96 (docs/guidance.rst)
Ny = 96  # binormal points: 49 ky rows in steps of 0.0476
Nz = 48  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 48 points
Lx = 62.8  # radial box length in rho_i; kx spacing 2 pi/Lx = 0.1
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "fix aspect"  # VMEC flux-tube boundary (fix aspect, docs/inputs.rst)
y0 = 21.0  # ky spacing 1/y0 = 0.0476, the lowest finite ky
ntheta = 48  # points per poloidal turn; the z grid has 48 points
nperiod = 1  # z-grid turns 2*nperiod - 1 = 1; the VMEC line length is npol

[time]
# Optional runtime controls; intervals use normalized time, like t_max.
# chunk_steps = 128  # Defaults: 128 explicit steps, 32 adaptive IMEX steps.
# diagnostics_interval = 5.0  # Overrides the step-stride cadence.
t_max = 200.0  # end time in a/v_ti; the cap when run_to = saturation
sample_stride = 50  # steps between stored samples
diagnostics_stride = 50  # steps between diagnostic rows

[geometry]
model = "vmec"
vmec_file = "../vmec/wout_NuhrenbergZille_1988_QHS.nc"
#geometry_file = ".cache/gkx/hsx_qhs_vac_s064.eik.nc"
torflux = 0.64
alpha = 0.0
# Short field line: growth rates are not converged below npol = 3; see docs/guidance.rst.
npol = 1.0  # VMEC line length in poloidal turns; a speed choice, docs/guidance.rst advises npol >= 3 for converged rates

[init]
init_field = "density"
init_amp = 1e-3
gaussian_init = false
init_single = false

[physics]
linear = false
nonlinear = true
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
beta = 0.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
D_hyper = 0.05
damp_ends_widthfrac = 0.125

[normalization]
contract = "kinetic"
diagnostic_norm = "rho_star"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
hyperdiffusion = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 1.0

[run]
ky = 0.047619047619047616  # k_y rho_i of the selected mode, the nearest dealiased row (spacing 0.0476)
Nl = 4  # Laguerre moments (v_perp); default 4
Nm = 8  # Hermite moments (v_par); default 8

[output]
# Optional saved-record cadence in the same time units as time.t_max.
# time_interval = 10.0  # nsave and nstep_restart keep step-based checkpoints.
path = "../../tools_out/hsx_nonlinear_vmec_runtime"
