schema_version = 1

# Nonlinear ITG in the quasi-helically symmetric HSX-like equilibrium of
# Nuhrenberg & Zille (1988), tutorial resolution (16x16x32, (Nl, Nm) = (2, 4),
# 200 fixed steps). The flux tube is sampled from a VMEC wout at s = 0.64;
# run.py generates the wout with vmex when it is missing. The run shows the
# linear phase only. case_full.toml is the 96x96x48 production deck.
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.01
kinetic = true

[grid]
Nx = 16
Ny = 16
Nz = 32
Lx = 62.8
Ly = 62.8
boundary = "fix aspect"
y0 = 21.0
ntheta = 32
nperiod = 1

[time]
t_max = 10.0
dt = 0.05
method = "rk3"
sample_stride = 10
diagnostics_stride = 10
fixed_dt = true
# A fixed tutorial horizon, not a run to saturation.
run_to = "t_max"

[geometry]
model = "vmec"
vmec_file = "../vmec/wout_NuhrenbergZille_1988_QHS.nc"
torflux = 0.64
alpha = 0.0
npol = 1.0

[init]
init_field = "density"
init_amp = 1e-3
gaussian_init = false
init_single = false

[physics]
linear = false
nonlinear = true
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
beta = 0.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
D_hyper = 0.05
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "kinetic"
diagnostic_norm = "rho_star"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
hyperdiffusion = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 1.0

[run]
ky = 0.047619047619047616
Nl = 2
Nm = 4
steps = 200
