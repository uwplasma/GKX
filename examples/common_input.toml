schema_version = 1

# The common deck: nonlinear adiabatic-electron ITG in a stellarator flux tube,
# the case behind `gkx wout_XXX.nc`. The CLI fills in [geometry].vmec_file from
# the wout argument and writes the resolved deck next to the run outputs
# (<wout-stem>/gkx.toml). Only the keys that differ from the defaults appear;
# examples/reference_inputs lists every key. The decks of examples/ start from this
# one and comment each stepper or end-damping choice that deviates from it.
# src/gkx/data/common_input.toml is a symlink to this file.

[[species]]
tprim = 3.0
fprim = 1.0
nu = 0.01

[grid]
Nx = 96
Ny = 96
Nz = 48
boundary = "fix aspect"
y0 = 14.0  # dky*rho = 0.071, the published W7-X spacing; scan-calibrated
ntheta = 48
nperiod = 1

[time]
# No dt, method or damp_ends_rate: the CFL controller picks the stepper (auto)
# and the end-damping rate is 30 thermal transits per layer; the measurements
# are in docs/guidance.rst (End damping, Common deck).
# chunk_steps = 128  # Defaults: 128 explicit steps, 32 adaptive IMEX steps.
# diagnostics_interval = 5.0  # Overrides the step-stride cadence.
# Use a fixed horizon until the saturation rule passes independent validation.
t_max = 200.0
sample_stride = 50
diagnostics_stride = 50

[geometry]
model = "vmec"
# vmec_file is injected by the CLI from the wout positional or --vmec/--vmex.
torflux = 0.64
# Short field line: growth rates are not converged below npol = 3; see docs/guidance.rst.
npol = 1.0

[init]
init_amp = 1e-3
init_single = false

[physics]
linear = false
nonlinear = true

[collisions]
D_hyper = 0.05

[normalization]
contract = "kinetic"

[terms]
hyperdiffusion = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 1.0

[run]
ky = 0.07142857142857142  # 1/y0: the first finite ky of the y0 = 14 box
Nl = 4
Nm = 8

[output]
# Optional saved-record cadence in the same time units as time.t_max.
# time_interval = 10.0  # nsave and nstep_restart keep step-based checkpoints.
