schema_version = 1

# Cyclone base case ITG, tutorial resolution: s-alpha geometry, one kinetic ion
# species, adiabatic electrons. The resolution
# is deliberately coarse (Nz = 16, Nl = 2, Nm = 4, gamma*t_max ~ 10), so growth
# rates are qualitative. case_full.toml is the GX-matched literature deck.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
tprim = 2.49  # a/L_Ti
fprim = 0.8   # a/L_n

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0  # ky spacing 1/y0 = 0.1
ntheta = 16
nperiod = 1

[time]
t_max = 80.0  # about 10 e-folds at ky 0.3
dt = 0.025  # below the CFL-stable step at ky 0.4
# rk2 at a fixed step: gamma within 0.05% of the eigensolver and of rk4 + CFL, in
# 0.6x the time of rk4 + CFL (docs/guidance.rst, Linear time stepping).
method = "rk2"
sample_stride = 1

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
adiabatic_electrons = true
tau_e = 1.0

[normalization]
contract = "cyclone"

[run]
Nl = 2
Nm = 4
solver = "time"
