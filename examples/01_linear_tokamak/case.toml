schema_version = 1

# Cyclone base case ITG: s-alpha geometry, one kinetic ion species, adiabatic
# electrons. The cheapest resolution at which gamma and omega are within 2% of
# the GX reference (src/gkx/data/cyclone_reference_adiabatic.csv) and of the next
# larger Nm, at ky = 0.2, 0.3 and 0.4. case_full.toml is the GX-matched
# literature deck (24 ky values, minutes).
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
tprim = 2.49  # a/L_Ti
fprim = 0.8   # a/L_n

[grid]
Nx = 1  # radial points = kx modes; 1 = the single kx = 0 mode, right for a linear run (nonlinear needs a radial box)
Ny = 12  # binormal points: 7 ky rows, 0 to 0.6 in steps of 0.1; [run] ky picks one
Nz = 24  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 36 points
Lx = 62.8  # radial box length in rho_i; unused at Nx = 1 (the kx spacing is 2 pi/Lx)
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "linked"  # twist-and-shift parallel boundary (links kx rows when Nx > 1)
y0 = 10.0  # ky spacing 1/y0 = 0.1
ntheta = 12  # points per poloidal turn (36 in all); gamma at ky 0.4 is 0.9% below ntheta = 24 and 4% above ntheta = 6 (Nl 8, Nm 24)
nperiod = 2  # a one-period line is 2-37% off in gamma

[time]
t_max = 96.0  # 7 e-folds at ky 0.2; shorter horizons keep the transient in the fit
dt = 0.008  # below the CFL-stable step at Nm = 48
method = "rk4"  # rk2 is unstable at this Nm
sample_stride = 50  # 12000 steps, 240 samples

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
adiabatic_electrons = true
tau_e = 1.0

[normalization]
contract = "cyclone"

[run]
Nl = 16  # Nl = 8 is 6-17% high in gamma, Nl = 12 is 3-5% low
Nm = 48  # ky = 0.4 gamma is -3.8, -3.1, -2.0, -0.7, +0.3% at Nm = 32, 40, 44, 48, 52; Nm = 28 is only a lucky cancellation
solver = "time"  # fit a time run
