schema_version = 1

# case.toml with Miller geometry instead of s-alpha: the same Cyclone ITG
# physics on a Miller local equilibrium at r/a = 0.5 (circular, unshifted; set
# akappa/tri to shape it). Run it with `gkx case_miller.toml`.

[[species]]
name = "ion"
tprim = 2.49  # a/L_Ti
fprim = 0.8   # a/L_n

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0  # ky spacing 1/y0 = 0.1
ntheta = 16
nperiod = 1

[time]
t_max = 20.0
dt = 0.05
method = "rk2"
sample_stride = 1

[geometry]
model = "miller"
rhoc = 0.5
q = 1.4
s_hat = 0.8
R0 = 2.77778
R_geo = 2.77778
shift = 0.0
akappa = 1.0  # elongation
akappri = 0.0
tri = 0.0     # triangularity
tripri = 0.0
betaprim = 0.0

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
adiabatic_electrons = true
tau_e = 1.0

[normalization]
contract = "cyclone"

[run]
Nl = 2
Nm = 4
solver = "time"
