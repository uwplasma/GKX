schema_version = 1

# Cyclone ITG k_y scan dispatched to independent workers, tutorial resolution.
# [parallel] strategy = "batch" runs one ordinary single-k_y solve per k_y value
# in the independent worker pool and gathers results in input order. It does
# not change solver defaults or use the combined-k_y solver layout.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
tprim = 2.49
fprim = 0.8

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0
ntheta = 16
nperiod = 2

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[physics]
linear = true
nonlinear = false
electrostatic = true
adiabatic_electrons = true

[run]
Nl = 2
Nm = 4
# An eigenpair, not a time fit: a 20-unit rk2 run reads gamma 20 to 66% low.
solver = "krylov"

[parallel]
strategy = "batch"
axis = "ky"
num_devices = 2
backend = "thread"
