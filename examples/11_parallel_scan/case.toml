schema_version = 1

# Cyclone ITG k_y scan dispatched to independent workers, tutorial resolution.
# [parallel] strategy = "batch" runs one ordinary single-k_y solve per k_y value
# in the independent worker pool and gathers results in input order. It does
# not change solver defaults or use the combined-k_y solver layout.

[[species]]
name = "ion"
tprim = 2.49
fprim = 0.8

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0
ntheta = 16
nperiod = 1

[time]
t_max = 20.0
dt = 0.05
method = "rk2"
sample_stride = 1
progress_bar = false

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[physics]
linear = true
nonlinear = false
electrostatic = true
adiabatic_electrons = true

[run]
Nl = 2
Nm = 4
solver = "time"

[parallel]
strategy = "batch"
axis = "ky"
num_devices = 2
backend = "thread"
