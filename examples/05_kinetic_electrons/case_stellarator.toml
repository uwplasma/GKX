schema_version = 1

# Tutorial nonlinear kinetic-electron ITG in the Landreman-Paul (2021)
# precise quasi-axisymmetric stellarator at s = 0.64. The geometry is solved
# when absent. CFL control includes electron streaming and field response;
# the tutorial horizon covers the start of the linear phase only.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.01
kinetic = true
Nl = 4  # ion Laguerre: finite Larmor radius
Nm = 8  # ion Hermite: slow parallel streaming

[[species]]
name = "electron"
charge = -1.0
mass = 0.00027
density = 1.0
temperature = 1.0
tprim = 3.0
fprim = 1.0
nu = 0.0
kinetic = true
Nl = 4  # electron Laguerre: tiny Larmor radius
Nm = 48  # electron Hermite: fast streaming and trapped electrons need many

[grid]
Nx = 16  # radial points = kx modes, spacing 2 pi/Lx = 0.1; 16 is a tutorial size, production runs use 64-96 (docs/guidance.rst)
Ny = 16  # binormal points: 9 ky rows in steps of 0.0476; production runs use 64-96 (docs/guidance.rst)
Nz = 36  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 36 points
Lx = 62.8  # radial box length in rho_i; kx spacing 2 pi/Lx = 0.1
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "fix aspect"  # VMEC flux-tube boundary (fix aspect, docs/inputs.rst)
y0 = 21.0  # ky spacing 1/y0 = 0.0476, the lowest finite ky
ntheta = 12  # points per poloidal turn; the z grid has 36 points (48 per turn for converged rates, docs/guidance.rst)
nperiod = 2  # supplies the VMEC line length npol = 2*nperiod - 1 = 3 turns (npol unset)

[time]
# Optional runtime controls; intervals use normalized time, like t_max.
# chunk_steps = 128  # Defaults: 128 explicit steps, 32 adaptive IMEX steps.
# diagnostics_interval = 0.05  # Overrides the step-stride cadence.
# End damping takes the default rate (about 600, 30 transits of the electron
# thermal speed per layer). A weak fixed rate of 0.1 lets the tokamak deck of this
# example grow without bound (Q reaches 1e4 by t = 20 against 1e-6 at the default).
t_max = 0.3  # end time in a/v_ti; a fixed tutorial horizon, not a saturated state
sample_stride = 10  # steps between stored samples
diagnostics_stride = 10  # steps between diagnostic rows
run_to = "t_max"

[geometry]
model = "vmec"
vmec_file = "../vmec/wout_LandremanPaul2021_QA_lowres.nc"
torflux = 0.64
alpha = 0.0

[init]
init_field = "density"
init_amp = 1e-3
gaussian_init = false
init_single = false

[physics]
linear = false
nonlinear = true
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = false
adiabatic_electrons = false
adiabatic_ions = false
beta = 1.0e-4
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
D_hyper = 0.05
damp_ends_widthfrac = 0.125

[normalization]
contract = "kinetic"
diagnostic_norm = "rho_star"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
hyperdiffusion = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 1.0

[run]
ky = 0.047619047619047616  # k_y rho_i of the selected mode, the nearest dealiased row (spacing 0.0476)
Nl = 4  # Laguerre moments (v_perp); the largest count of any species
Nm = 48  # Hermite moments (v_par); electrons need many, docs/guidance.rst (Resolution)

[output]
# Optional saved-record cadence in the same time units as time.t_max.
# time_interval = 0.1  # nsave and nstep_restart keep step-based checkpoints.
