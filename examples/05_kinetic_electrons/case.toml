schema_version = 1

# Tutorial nonlinear Cyclone ITG with kinetic electrons. The horizon covers
# the start of the linear phase. CFL control includes electron streaming
# and the electromagnetic field response; transport requires a longer run.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
kinetic = true

[[species]]
name = "electron"
charge = -1.0
mass = 0.00027
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
kinetic = true

[grid]
Nx = 16
Ny = 16
Nz = 16
Lx = 176.25000339052914
Ly = 62.8
boundary = "linked"
y0 = 28.2
ntheta = 16
# Short field line: growth rates are not converged below nperiod = 2; see docs/guidance.rst.
nperiod = 1

[time]
# Optional runtime controls; intervals use normalized time, like t_max.
# chunk_steps = 128  # Defaults: 128 explicit steps, 32 adaptive IMEX steps.
# diagnostics_interval = 0.05  # Overrides the step-stride cadence.
t_max = 0.3
sample_stride = 10
diagnostics_stride = 10
run_to = "t_max"
compressed_real_fft = true
laguerre_nonlinear_mode = "grid"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-3
init_single = false
random_seed = 22
gaussian_init = false
kpar_init = 0.0

[physics]
linear = false
nonlinear = true
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = false
adiabatic_electrons = false
beta = 1.0e-4

[collisions]
D_hyper = 0.05
p_hyper_kperp = 2.0
hypercollisions_const = false
hypercollisions_kz = true
p_hyper = 2
p_hyper_m = 4
damp_ends_widthfrac = 0.125

[terms]
nonlinear = 1.0
hyperdiffusion = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0

[normalization]
contract = "cyclone"
diagnostic_norm = "rho_star"

[run]
ky = 0.3
Nl = 4
Nm = 16

[output]
# Optional saved-record cadence in the same time units as time.t_max.
# time_interval = 0.1  # nsave and nstep_restart keep step-based checkpoints.
