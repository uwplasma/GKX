schema_version = 1

# Nonlinear Cyclone ITG with kinetic ions and electrons, tutorial resolution.
# The two species keep different numbers of velocity moments: the electrons
# the state's (Nl, Nm) = (4, 16) from [run], the ions fewer. A multi-device run
# cuts each species' Hermite axis at its own size, so every device carries the
# same share of both (run.py sets the parallel block). The run is the default
# one: the CFL controller sets the step and diagnostics are saved. Collisions
# are off: the sharded explicit route does not apply them.

[[species]]
name = "ion"
tprim = 2.49
fprim = 0.8
Nl = 2           # ions keep (2, 8) ...
Nm = 8

[[species]]
name = "electron"
charge = -1.0
mass = 0.01      # heavier than physical so the CFL step stays long
tprim = 2.49
fprim = 0.8      # ... electrons keep the state's (4, 16)

[grid]
Nx = 4
Ny = 8
Nz = 8
Lx = 62.8
Ly = 62.8
boundary = "periodic"

[time]
method = "rk4"      # explicit: kinetic electrons default to imex-ark3, which keeps
                    # the whole-state placement (no sharded implicit solve)
t_max = 0.1         # no dt, no fixed_dt: the CFL controller sets the step
run_to = "t_max"    # stop at t_max instead of at heat-flux saturation
progress_bar = false

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-2
init_single = false

[physics]
linear = false
nonlinear = true
electrostatic = true
adiabatic_electrons = false

[terms]
collisions = 0.0
hypercollisions = 0.0
end_damping = 0.0

[normalization]
contract = "cyclone"

[run]
ky = 0.3
Nl = 4
Nm = 16
