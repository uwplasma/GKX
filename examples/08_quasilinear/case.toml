schema_version = 1

# Cyclone ITG with the mixing-length quasilinear diagnostic, tutorial
# resolution (explicit time solver, Nz = 16, (Nl, Nm) = (2, 4)). The saturated
# flux is uncalibrated: it ranks spectra, it does not predict absolute flux.
# case_full.toml uses the Krylov eigensolver at (Nl, Nm) = (8, 8).
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "periodic"

[time]
t_max = 20.0
dt = 0.05
method = "rk2"
sample_stride = 1

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1e-8
gaussian_init = false

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
hypercollisions_const = 1.0
hypercollisions_kz = 0.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"
flux_scale = 1.0

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[quasilinear]
enabled = true
mode = "saturated"
saturation_rule = "mixing_length"
amplitude_normalization = "phi_rms"
kperp_average = "phi_weighted"
csat = 1.0
gamma_floor = 0.0
include_stable_modes = false
channels = ["es"]
write_spectrum = true

[run]
ky = 0.3
Nl = 2
Nm = 4
solver = "time"
