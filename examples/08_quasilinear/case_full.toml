schema_version = 1

# Cyclone linear quasilinear transport diagnostic example.
# This computes eigenfunction-resolved electrostatic heat/particle flux weights
# from one linear mode, then applies an explicit uncalibrated mixing-length
# saturation rule. Treat the saturated flux as a model output that requires
# nonlinear calibration before making absolute transport claims.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1  # radial points = kx modes; 1 = the single kx = 0 mode, right for a linear run (nonlinear needs a radial box)
Ny = 12  # binormal points: 7 ky rows, 0 to 0.6 in steps of 0.1; [run] ky picks one
Nz = 32  # points along the field line, one 2 pi turn
Lx = 62.8  # radial box length in rho_i; unused at Nx = 1 (the kx spacing is 2 pi/Lx)
Ly = 62.8  # binormal box length in rho_i; ky spacing 2 pi/Ly = 0.1
boundary = "periodic"  # periodic in z; no kx linking

[time]
# Read only by a time-route run; solver = "krylov" below needs no time loop.
t_max = 0.2  # end time in a/v_ti; unused by solver = krylov
dt = 0.01  # fixed step in a/v_ti; 20 steps to t_max
method = "rk2"  # explicit 2nd-order Runge-Kutta
sample_stride = 1  # steps between stored samples; 20 samples

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1e-8
gaussian_init = false

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
hypercollisions_const = 1.0
hypercollisions_kz = 0.0
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"
flux_scale = 1.0

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[output]
path = "tools_out/cyclone_quasilinear"

[quasilinear]
enabled = true
mode = "saturated"
saturation_rule = "mixing_length"
amplitude_normalization = "phi_rms"
kperp_average = "phi_weighted"
csat = 1.0
gamma_floor = 0.0
include_stable_modes = false
channels = ["es"]

[run]
ky = 0.3  # k_y rho_i of the single mode, the nearest grid row (spacing 0.1)
Nl = 8  # Laguerre moments (v_perp); default 12; below the default
Nm = 8  # Hermite moments (v_par); default 24; below the default
solver = "krylov"  # eigenpair of the linear operator

[scan]
ky = [0.1, 0.2, 0.3, 0.4]
Nl = 8
Nm = 8
solver = "krylov"
