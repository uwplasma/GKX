schema_version = 1

# Cyclone ITG with the gyrokinetic (finite-Larmor) Coulomb collision operator.
#
#   JAX_ENABLE_X64=1 gkx examples/linear/axisymmetric/cyclone_coulomb_collisions.toml
#
# Swap [time] collision_operator to compare the shipped models:
#   "lenard_bernstein"      conserving diagonal relaxation (the built-in term)
#   "sugama"                drift-kinetic Sugama          (Frei 2022, C6a-C6f)
#   "improved_sugama"       improved drift-kinetic Sugama (Frei 2022, + C103)
#   "coulomb"               drift-kinetic Coulomb         (Frei 2022, C9a-C9f)
#   "coulomb_finite_kperp"  gyrokinetic Coulomb           (Frei 2021, 3.47-3.50)
#
# Two constraints apply to the moment operators:
#   * Nl * Nm must equal 8, the tabulated Hermite-Laguerre truncation.
#   * They run on the fixed-step cached integrator, so solver = "time";
#     the Krylov eigenvalue path does not carry them.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.05
kinetic = true

[grid]
Nx = 1
Ny = 24
Nz = 96
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 20.0
ntheta = 32
nperiod = 2

[time]
# This case has no Krylov path and no GX counterpart, so the time horizon is the
# only route to a converged growth rate. Collisions lower gamma to ~0.0716, so
# gamma*t_max >= 7 needs t_max >= 98; 120 leaves margin (gamma*t_max ~= 8.6).
# Measured at t_max = 10 the fit reports 0.0839, 17% high. dt and the scheme are
# unchanged -- the moment collision operators require the fixed-step integrator.
t_max = 120.0
dt = 0.002
method = "rk2"
sample_stride = 2
progress_bar = true
collision_operator = "coulomb_finite_kperp"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3
Nl = 4
Nm = 2
solver = "time"

[fit]
# window_method left at the default "stationary"; see cyclone.toml for why the
# "loglinear" override was removed. The dropped max_fraction / end_fraction /
# max_amp_fraction / late_penalty keys only fed that scorer, and were in any
# case filtered out by RUNTIME_COMMAND_FIT_KEYS before reaching the fit.
auto_window = true
window_fraction = 0.3
start_fraction = 0.58
min_points = 80
min_amp_fraction = 0.05
mode_method = "z_index"
