schema_version = 1

# Cyclone ITG with the gyrokinetic (finite-Larmor) Coulomb collision operator,
# tutorial resolution: seconds per collision model on a laptop CPU. The moment
# collision operators use the tabulated eight-moment basis (Nl, Nm) = (2, 4)
# and the fixed-step integrator (solver = "time"). case_full.toml runs the same
# physics to t_max = 120 for a converged growth rate.
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.05
kinetic = true

[grid]
Nx = 1
Ny = 12
Nz = 16
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0
ntheta = 16
nperiod = 1

[time]
t_max = 20.0
dt = 0.01
method = "rk2"
sample_stride = 5
collision_operator = "coulomb_finite_kperp"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3
Nl = 2
Nm = 4
solver = "time"
