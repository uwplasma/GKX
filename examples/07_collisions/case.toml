schema_version = 1

# Cyclone ITG with the gyrokinetic (finite-Larmor) Coulomb collision operator,
# tutorial resolution. run.py compares the shipped collision operators on it;
# only "coulomb_finite_kperp" is tabulated, at (Nl, Nm) = (2, 4) on the
# fixed-step integrator (solver = "time"). case_full.toml runs the same physics
# to t_max = 120 for a converged growth rate.
# Starts from examples/common_input.toml: the species, geometry, grid, resolution and horizon
# below are the case; a departure from its stepper or end-damping choice has its own comment.
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.05
kinetic = true

[grid]
Nx = 1  # radial points = kx modes; 1 = the single kx = 0 mode, right for a linear run (nonlinear needs a radial box)
Ny = 12  # binormal points: 7 ky rows, 0 to 0.6 in steps of 0.1; [run] ky picks one
Nz = 16  # unused while ntheta is set: the line holds ntheta*(2*nperiod - 1) = 48 points
Lx = 62.8  # radial box length in rho_i; unused at Nx = 1 (the kx spacing is 2 pi/Lx)
Ly = 62.8  # unused while y0 is set (y0 sets the ky spacing)
boundary = "linked"  # twist-and-shift parallel boundary (links kx rows when Nx > 1)
y0 = 10.0  # ky spacing 1/y0 = 0.1, the lowest finite ky
ntheta = 16  # points per poloidal turn; the z grid has 48 points
nperiod = 2  # line of 2*nperiod - 1 = 3 turns; linear linked runs need nperiod >= 2 (docs/guidance.rst)

[time]
# Time route: coulomb_finite_kperp has no eigensolver. t_max = 60 reads gamma within
# 0.003% of t_max = 200 (20 reads 2% high); rk2 at this dt and rk4 + CFL agree to 1e-5.
t_max = 60.0  # end time in a/v_ti; the growth-rate fit needs several e-folds before it
dt = 0.01  # fixed step in a/v_ti; 6000 steps to t_max
method = "rk2"  # explicit 2nd-order Runge-Kutta
sample_stride = 5  # steps between stored samples; 1200 samples
collision_operator = "landau"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3  # k_y rho_i of the single mode, the nearest grid row (spacing 0.1)
Nl = 2  # Laguerre moments (v_perp); default 12; tutorial size
Nm = 4  # Hermite moments (v_par); default 24; tutorial size
solver = "time"  # fit a time run
