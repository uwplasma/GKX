schema_version = 1

# Cyclone ITG with the gyrokinetic (finite-Larmor) Coulomb collision operator.
#
#   JAX_ENABLE_X64=1 gkx examples/07_collisions/case_full.toml
#
# Swap [time] collision_operator to compare the shipped models:
#   "landau"                linearized Landau, drift-kinetic (default, any Nl, Nm)
#   "sugama"                Sugama et al. 2009            (any Nl, Nm)
#   "improved_sugama"       Sugama et al. 2019            (any Nl, Nm)
#   "lenard_bernstein"      conserving diagonal relaxation
#   "coulomb_finite_kperp"  gyrokinetic Coulomb           (Frei 2021, 3.47-3.50)
#
# The first four run at any (Nl, Nm) on every solver (time, krylov, ...).
# "coulomb_finite_kperp" is tabulated, so it needs (Nl, Nm) = (J+1, P+1) of a
# shipped table, (2, 4) or (3, 6) (the transposed (4, 2) is refused), and the
# fixed-step integrator: solver = "time".

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.05
kinetic = true

[grid]
Nx = 1
Ny = 24
Nz = 96
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 20.0
ntheta = 32
nperiod = 2

[time]
# Collisions reduce the growth rate, so this fixed-step case uses a long
# horizon to separate the asymptotic mode from startup transients.
t_max = 120.0
dt = 0.002
method = "rk2"
sample_stride = 2
progress_bar = true
collision_operator = "coulomb_finite_kperp"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
tau_e = 1.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.3
Nl = 2
Nm = 4
solver = "time"

[fit]
# Use the default stationary fit-window selection.
auto_window = true
window_fraction = 0.3
start_fraction = 0.58
min_points = 80
min_amp_fraction = 0.05
mode_method = "z_index"
