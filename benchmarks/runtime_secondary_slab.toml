schema_version = 1

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 0.0
fprim = 0.0
nu = 0.0
kinetic = true

[grid]
Nx = 4
Ny = 4
Nz = 8
Lx = 125.66370614359172
Ly = 62.83185307179586
boundary = "periodic"
y0 = 10.0
ntheta = 8
nperiod = 1

[time]
# run_to must stay "t_max". This deck ships as the stage-1 linear seed, but
# benchmarks/secondary_slab_workflow.py promotes it through
# build_secondary_stage2_config into a nonlinear run that inherits this [time]
# block, so the stop policy set here is the one stage 2 obeys. Stage 2 measures
# the secondary growth rate from a log-linear fit to phi_mode over the last
# half of its trace; its heat flux is a by-product at -5.6e-12 (zero gradients,
# a seeded primary mode), and a horizon chosen by that flux would set the
# fitting window for a growth rate that has nothing to do with it.
run_to = "t_max"
t_max = 2.0
dt = 1.0
method = "sspx3"
use_diffrax = false
sample_stride = 1
fixed_dt = true
cfl = 1.0

[geometry]
model = "slab"
s_hat = 1e-8

[init]
init_field = "density"
init_amp = 1.0
gaussian_init = false
init_single = true
kpar_init = 0.0

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
beta = 0.0
collisions = false
hypercollisions = false

[collisions]
damp_ends_amp = 0.0
damp_ends_widthfrac = 0.0

[normalization]
contract = "kinetic"
diagnostic_norm = "rho_star"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 0.0
hypercollisions = 0.0
hyperdiffusion = 0.0
end_damping = 0.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.1
Nl = 3
Nm = 8
solver = "time"
