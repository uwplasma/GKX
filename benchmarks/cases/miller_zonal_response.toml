schema_version = 1

# Merlo et al. Phys. Plasmas 23, 032104 (2016), Rosenbluth-Hinton/GAM
# benchmark, Case III at r/a = 0.5.  The physics contract follows Sec. V:
# adiabatic electrons, zero density/temperature gradients, ky = 0,
# kx rho_i = 0.05, no hyperdiffusion, and a small initial ion-density
# perturbation used to excite the signed zonal response.
#
# Table III values encoded below:
# q_s = 1.389, s_hat = 0.751, kappa = 1.4723, delta = -0.0070,
# D = -0.0139, a_MHD = 0.5425, dRgeom/dr = -0.1569,
# dkappa/dr = -0.0728, ddelta/dr = -0.0140.
[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 0.0
fprim = 0.0
nu = 0.0
kinetic = true

[grid]
Nx = 6
Ny = 8
Nz = 32
Lx = 125.6
Ly = 62.8
boundary = "periodic"

[time]
# run_to must stay "t_max": this is a zero-gradient relaxation benchmark whose
# heat flux is identically ~0, so the default run_to = "saturation" declares the
# flux window converged inside the first chunk and truncates the trace at
# t ~ 6.4 -- less than one GAM period -- without raising.
run_to = "t_max"
t_max = 60.0
dt = 0.0025
method = "rk2"
sample_stride = 10
diagnostics_stride = 10
fixed_dt = true
diagnostics = true

[geometry]
model = "miller"
q = 1.389
s_hat = 0.751
epsilon = 0.18
R0 = 2.77778
R_geo = 2.77778
shift = -0.1569
akappa = 1.4723
akappri = -0.0728
tri = -0.0070
tripri = -0.0140
betaprim = 0.0

[init]
init_field = "density"
init_amp = 1.0e-6
gaussian_init = false
init_single = true
init_electrons_only = false

[physics]
linear = false
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
collisions = false
hypercollisions = false

[collisions]
nu_hermite = 0.0
nu_laguerre = 0.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 0.0
D_hyper = 0.0
p_hyper_kperp = 2.0
damp_ends_amp = 0.0
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "rho_star"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 0.0
hypercollisions = 0.0
hyperdiffusion = 0.0
end_damping = 0.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[expert]
source = "default"
phi_ext = 0.0

[run]
ky = 0.0
kx = 0.05
Nl = 4
Nm = 144
dt = 0.0025
steps = 24000
sample_stride = 10
diagnostics = true
