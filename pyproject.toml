[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gkx"
version = "1.8.0"
description = "JAX gyrokinetic solver with Hermite-Laguerre velocity space"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GKX team"}]
keywords = ["gyrokinetics", "jax", "plasma-physics", "tokamak", "stellarator", "turbulence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  # gkx.objectives.core opts into lax_linalg.eig(..., enable_eigvec_derivs=True),
  # which first shipped in jax 0.10.1.
  "jax>=0.10.1",
  "jaxlib>=0.10.1",
  "numpy",
  "matplotlib",
  "scipy",
  "netCDF4",
  "diffrax",
  "equinox",
  "solvax>=0.12.0",
  # The VMEC geometry path hard-requires the booz_xform_jax bridge
  # (gkx.geometry.backend_discovery).
  "booz_xform_jax",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/uwplasma/GKX"
Documentation = "https://github.com/uwplasma/GKX/tree/main/docs"
Repository = "https://github.com/uwplasma/GKX"
Issues = "https://github.com/uwplasma/GKX/issues"

[project.optional-dependencies]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "matplotlib",
]
release = [
  "build",
  "twine",
]
dev = [
  "pytest",
  "pytest-cov",
  # Pinned: ruff's default rule set is not stable across releases, so an
  # unpinned dev install lints this tree against whatever rules the newest
  # ruff happens to default to. See [tool.ruff.lint] below.
  "ruff==0.16.4",
  "mypy",
  "mpmath",
  "gmpy2",
  "pandas",
  "Pillow",
  "mkdocs",
  "sphinx",
  "sphinx-rtd-theme",
  "matplotlib",
  "build",
  "twine",
]
assets = [
  "Pillow",
]

[project.scripts]
gkx = "gkx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gkx = ["data/*.csv", "data/*.json", "data/*.npy", "data/*.npz", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: tests that require or exercise GPU/device-specific execution paths",
  "integration: broader end-to-end or workflow tests",
  "slow: long-running literature or artifact validation tests kept out of bounded release coverage shards",
]

[tool.ruff.lint]
# State the rule set explicitly instead of inheriting ruff's default, which is
# not stable across ruff releases: ruff <= 0.15 defaulted to exactly the
# selection below, while ruff 0.16 widened the default and reports 1371
# findings on this tree (`ruff check . --statistics`: 357 I001, 195 RUF100,
# 92 UP035, ...) that the code has never been written against. This selection
# is what the source is written to and is clean on both ruff 0.15.12 and the
# pinned ruff 0.16.4; widening it is a deliberate, separate change.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"tools/**/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.mypy]
files = ["src/gkx"]
exclude = ["legacy_archive", "examples", "docs"]

[[tool.mypy.overrides]]
module = [
  "booz_xform",
  "booz_xform_jax",
  "netCDF4",
  "pandas",
  "rich",
  "rich.*",
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gkx.geometry.imported_vmec"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["gkx.geometry.imported_miller"]
disable_error_code = ["arg-type"]
