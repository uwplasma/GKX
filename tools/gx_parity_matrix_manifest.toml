# Linear parity matrix against the reference comparison code.
#
# Every case pins one reference-code output, the GKX configuration that
# transcribes that deck's physics contract, and the velocity resolution both
# codes use. The reference outputs are large and untracked; point
# GX_PARITY_REF_DIR at the directory holding them. Regenerate with
#   PYTHONPATH=src python tools/comparison/build_gx_parity_matrix.py
#
# reference_provenance records whether the spectrum being compared against is an
# upstream-shipped reference or one this campaign generated. A comparison
# against a self-generated spectrum is a cross-code check, not a check against a
# published result.
#
# reference_seconds / reference_peak_host_rss_mb are wall-clock and peak
# resident set size for the reference run that produced reference_output,
# measured on the same GPU with /usr/bin/time -v. The reference code is compiled
# in single precision; the GKX numbers here are float64 under JAX_ENABLE_X64.

[[case]]
key = "cyclone_salpha_itg"
label = "Cyclone ITG, s-alpha"
device = "tokamak"
drive = "ITG"
electrons = "adiabatic"
field_model = "electrostatic"
geometry = "s-alpha analytic"
config = "tools/comparison/fixtures/parity/cyclone_salpha_itg.toml"
reference_output = "ITG_cyclone/itg_salpha_adiabatic_electrons.out.nc"
reference_provenance = "upstream shipped reference, reproduced by this build"
Nl = 16
Nm = 48
dt = 0.002
steps = 75000
method = "imex2"
fit_start_fraction = 0.7

