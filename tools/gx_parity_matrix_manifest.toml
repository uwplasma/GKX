# The one case in this matrix whose reference number depends on how the
# reference code was compiled. Two builds of the same reference commit
# (3865a537), differing only in -prec-sqrt=true, move gamma by +0.163% at
# ky = 0.2 and -0.175% at ky = 0.3, and omega by +0.204% at ky = 0.2, measured
# against a run-to-run noise floor of exactly zero -- the same binary rerun
# reproduces omega_kxkyt bitwise, so all of that is the flag. Every other case in this matrix is bit-identical between
# those builds or moves by at most 0.07%. The mechanism is not mysterious: this
# is the electromagnetic branch at finite beta with kinetic electrons and the
# shortest integration in the matrix (t = 20 against t = 150), so it is the case
# where single-precision sqrt rounding has the most room to accumulate.
# 0.003 rounds 0.204% up to the next clean figure. Below it, this row measures
# nvcc's arithmetic rather than either code's physics.
# Not fixed by regenerating the reference: upstream itself is not uniform -- 4
# of its 20 makefiles carry the flag and the rest do not -- so pinning one build
# would leave the same spread against every reference taken on the others.
# Measurement: branch-only research roadmap, plan/notes/gx_precsqrt.md, sections 4--5.
build_reproducibility_floor = 0.003
Nl = 16
Nm = 48
dt = 0.0002
steps = 100000
method = "imex2"
fit_start_fraction = 0.7

