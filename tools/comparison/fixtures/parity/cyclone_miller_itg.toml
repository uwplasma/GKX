# Cyclone ITG, Miller geometry, adiabatic electrons.
#
# Physics contract transcribed from the reference-code input deck
#   benchmarks/linear/ITG_cyclone/itg_miller_adiabatic_electrons.in
# Geometry is imported from that deck's own output so both codes integrate the
# same geometric coefficients. Set GX_PARITY_REF_DIR to the directory holding
# the reference outputs before running.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1
Ny = 46
Nz = 96
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 20.0
ntheta = 32
nperiod = 2

[time]
t_max = 10.0
dt = 0.002
method = "imex2"
sample_stride = 2

[geometry]
model = "eik"
geometry_file = "$GX_PARITY_REF_DIR/ITG_cyclone/itg_miller_adiabatic_electrons.out.nc"

[init]
init_field = "density"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5

[physics]
linear = true
nonlinear = false
electrostatic = true
electromagnetic = false
adiabatic_electrons = true
adiabatic_ions = false
tau_e = 1.0
beta = 0.0
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "cyclone"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 0.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.4
Nl = 16
Nm = 48
solver = "time"
