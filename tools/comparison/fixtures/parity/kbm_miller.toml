# KBM, Miller geometry, kinetic electrons at finite beta.
#
# Physics contract transcribed from the reference-code input deck
#   benchmarks/linear/KBM/kbm_miller.in
# Geometry is imported from that deck's own output so both codes integrate the
# same geometric coefficients. Set GX_PARITY_REF_DIR to the directory holding
# the reference outputs before running.

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[[species]]
name = "electron"
charge = -1.0
mass = 2.7e-4
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.0
kinetic = true

[grid]
Nx = 1
Ny = 16
Nz = 96
Lx = 62.8
Ly = 62.8
boundary = "linked"
y0 = 10.0
ntheta = 32
nperiod = 2

[time]
t_max = 10.0
dt = 0.0005
method = "imex2"
sample_stride = 8

[geometry]
model = "eik"
geometry_file = "$GX_PARITY_REF_DIR/KBM/kbm_miller.out.nc"

[init]
init_field = "all"
init_amp = 1.0e-10
gaussian_init = true
gaussian_width = 0.5
init_electrons_only = true

[physics]
linear = true
nonlinear = false
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = false
adiabatic_electrons = false
adiabatic_ions = false
tau_e = 1.0
beta = 0.015
collisions = true
hypercollisions = true

[collisions]
nu_hermite = 1.0
nu_laguerre = 2.0
nu_hyper = 0.0
p_hyper = 4.0
hypercollisions_const = 0.0
hypercollisions_kz = 1.0
damp_ends_amp = 0.1
damp_ends_widthfrac = 0.125

[normalization]
contract = "kbm"
diagnostic_norm = "none"

[terms]
streaming = 1.0
mirror = 1.0
curvature = 1.0
gradb = 1.0
diamagnetic = 1.0
collisions = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 0.0
nonlinear = 0.0

[run]
ky = 0.2
Nl = 16
Nm = 48
solver = "time"
