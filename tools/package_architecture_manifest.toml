[metadata]
schema_version = 1
title = "Package architecture policy"
layout_authority = "README.md"
status = "active"

[root_prefix_policy]
blocked_prefixes = [
  "runtime_",
  "nonlinear_",
  "linear_",
  "solver_",
  "vmex_",
  "quasilinear_",
  "benchmark_",
  "stellarator_",
]
allowed_root_prefix_modules = []

[package_policy]
required_domain_packages = [
  "gkx.artifacts",
  "gkx.diagnostics",
  "gkx.geometry",
  "gkx.objectives",
  "gkx.operators",
  "gkx.operators.linear",
  "gkx.operators.nonlinear",
  "gkx.parallel",
  "gkx.workflows",
  "gkx.workflows.runtime",
]
required_docs = [
  "README.md",
]
target_domain_packages = [
  "gkx.physics",
  "gkx.geometry",
  "gkx.numerics",
  "gkx.solve",
  "gkx.optimize",
  "gkx.io",
]

[topology_policy]
mode = "no_regression_until_target"
description = "Track the consolidation plan without breaking current CI before files are moved. Counts must not increase beyond the audited baseline; final release can pass --require-topology-targets to enforce the target ceilings."

[[topology_policy.counts]]
name = "installable_source_python_files"
path = "src/gkx"
pattern = "*.py"
recursive = true
# 124 -> 125: Lawson integrating-factor steppers.
# 125 -> 128: the three package markers of gkx.solvers, gkx.solvers.linear and gkx.solvers.nonlinear
# replace sixteen flat solvers_* modules; 128 -> 129: the saturated-window heat flux and sheared
# transport drivers leave solvers/nonlinear/diagnostics.py for solvers/nonlinear/transport_window.py.
baseline = 129
target = 45

[[topology_policy.counts]]
name = "test_python_files"
path = "tests"
pattern = "*.py"
recursive = true
baseline = 30
target = 30

[[topology_policy.counts]]
name = "tool_python_files"
path = "tools"
pattern = "*.py"
recursive = true
baseline = 0
target = 0

[[topology_policy.counts]]
name = "developer_script_python_files"
path = "scripts"
pattern = "*.py"
recursive = true
baseline = 16
target = 12


[[topology_policy.counts]]
name = "flat_test_python_files"
path = "tests"
pattern = "*.py"
recursive = false
baseline = 1
target = 1

[[topology_policy.counts]]
name = "flat_tool_python_files"
path = "tools"
pattern = "*.py"
recursive = false
baseline = 0
target = 0

[layer_policy]
description = "Ratchet down imports that run against the layering. The model was analytic until now: the plan measured it by hand and nothing enforced it, so every edge fixed could silently return."
violation_baseline = 4

[layer_policy.layers]
config = 0
core_grid = 0
core_velocity = 0
callbacks = 0
compilation_cache = 0
diagnostics_contract = 0
geometry = 1
terms = 2
operators = 2
solvers = 3
parallel = 3
diagnostics = 4
objectives = 5
artifacts = 6
benchmarking_shared = 6
workflows = 7
runtime = 7
cli = 8
api = 8

[cohesion_policy]
description = "Promote cohesion instead of capping file length. A per-file line cap does not reduce complexity, it relocates it: a module that outgrows the cap gets split and the offcut becomes a helper with exactly one consumer."
min_imported_names_for_split = 6
single_consumer_baseline = 2
single_consumer_target = 0
low_cohesion_baseline = 8
low_cohesion_target = 0
min_definitions_for_cohesion = 6
min_internal_cohesion = 0.30
single_consumer_exempt = []

[complexity_policy]
mode = "no_regression_until_target"
description = "Catch runaway modules. This is a tripwire, not a design target: cohesion_policy above is the instrument that shapes module boundaries."
default_max_lines = 1200
public_facade_max_lines = 500
public_facades = [
  "api/__init__.py",
  "benchmarks.py",
  "linear.py",
  "nonlinear.py",
  "quasilinear.py",
  "runtime.py",
]

[[complexity_policy.exceptions]]
path = "solvers/nonlinear/imex.py"
baseline_lines = 1958
target_lines = 1200
reason = "The chain factor, its probes and its solve share one block layout; splitting the mirror blocks out would leave a helper with one consumer."

[[complexity_policy.exceptions]]
path = "solvers/nonlinear/diagnostics.py"
# 3524 -> 3529: the explicit chunk cache key carries the CFL factor.
# 3529 -> 3539: the prepared scan runs through the digest-keyed executable cache.
# 3539 -> 3542: Lawson integrating-factor steppers.
# 3542 -> 2747: the saturated-window heat flux and sheared drivers moved to transport_window.py.
baseline_lines = 2747
target_lines = 1200
reason = "The explicit and IMEX diagnostic drivers, the state integrators and the cached RHS share one set of kernels and options; the split modules only forwarded names to each other."

[[complexity_policy.exceptions]]
path = "solvers/time_explicit.py"
baseline_lines = 1701
target_lines = 1200
reason = "The CFL estimate, the one-step kernels and the linear explicit drivers are one integrator; the offcuts had a single consumer."

[[complexity_policy.exceptions]]
path = "artifacts/nonlinear_netcdf.py"
baseline_lines = 1183
target_lines = 1000
reason = "One NetCDF schema owner keeps dimensions, geometry, diagnostics, restart, and final-field variables consistent; reduce helper repetition without splitting the schema again."

[[complexity_policy.exceptions]]
path = "artifacts/io.py"
baseline_lines = 1151
target_lines = 1000
reason = "One runtime I/O owner keeps summaries, tables, restart packing, and diagnostic reload consistent; reduce repeated serializers without restoring format-specific modules."

[[complexity_policy.exceptions]]
path = "runtime.py"
baseline_lines = 1120
target_lines = 500
reason = "Public runtime facade; the overage is the exploded __all__ list, so shrink it by removing exports rather than by splitting the facade."

[[complexity_policy.exceptions]]
path = "workflows/nonlinear.py"
# 1192 -> 1210: explicit chunk retry at half the CFL factor.
# 1210 -> 1229: runaway criterion, retry warning and uniform chunk horizon.
# 1229 -> 1283: Lawson integrating-factor steppers and the automatic choice (drift share and
# step cap) between lawson-rk4-pi and rk4-pi.
baseline_lines = 1283
target_lines = 1000
reason = "One nonlinear-runtime dispatcher keeps the solver branches reporting the same result contract; reduce the per-branch duplication rather than splitting the dispatcher."

[[complexity_policy.exceptions]]
path = "workflows/runtime/commands.py"
baseline_lines = 1023
target_lines = 1000
reason = "One command table keeps the CLI subcommands parsing and dispatching consistently; reduce the per-command duplication rather than splitting the table."

[line_budget_policy]
mode = "no_regression_until_target"
description = "Track real code deletion rather than file reshuffling."

[[line_budget_policy.counts]]
name = "installable_source_python_lines"
path = "src/gkx"
pattern = "*.py"
recursive = true
# 69891 -> 70013: dougherty e-i collision operator, measured after merging main.
# 70013 -> 70061: nonlinear CFL factors and explicit chunk retry.
# 70061 -> 70069: paired-gradient bracket transform, documented in place, measured after merging main.
# 70069 -> 70073: paired-gradient bracket transform, documented in place, measured after merging main.
# 70073 -> 70109: cached solve executables, runaway criterion, CFL floor.
# 70109 -> 70332: Lawson integrating-factor steppers and the automatic choice between
# lawson-rk4-pi and rk4-pi.
# 70332 -> 70078: physical-time saturation detector replaces the window/guard stop gates.
# 70078 -> 70149: phase-1 split of the diagnostics driver (module header and export list of
# transport_window.py; no code added).
# 70149 -> 70150: IMEX chunk scan fix.
# 70150 -> 69996: the Pallas drift kernel is removed; the jnp drift terms serve every backend.
# 69996 -> 70008: removed-key mechanism, measured after merging main.
baseline = 70008
target = 45000

[[line_budget_policy.counts]]
name = "test_python_lines"
path = "tests"
pattern = "*.py"
recursive = true
baseline = 64954
target = 35000

[[line_budget_policy.counts]]
name = "tool_python_lines"
path = "tools"
pattern = "*.py"
recursive = true
baseline = 0
target = 0

[[line_budget_policy.counts]]
name = "developer_script_python_lines"
path = "scripts"
pattern = "*.py"
recursive = true
baseline = 16459
target = 16444
