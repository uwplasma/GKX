[metadata]
schema_version = 1
title = "Package architecture policy"
layout_authority = "README.md"
status = "active"

[root_prefix_policy]
blocked_prefixes = [
  "runtime_",
  "nonlinear_",
  "linear_",
  "solver_",
  "vmex_",
  "quasilinear_",
  "benchmark_",
  "stellarator_",
]
allowed_root_prefix_modules = []

[package_policy]
required_domain_packages = [
  "gkx.artifacts",
  "gkx.core",
  "gkx.diagnostics",
  "gkx.geometry",
  "gkx.objectives",
  "gkx.operators",
  "gkx.operators.linear",
  "gkx.operators.nonlinear",
  "gkx.parallel",
  "gkx.solvers",
  "gkx.solvers.linear",
  "gkx.solvers.nonlinear",
  "gkx.solvers.time",
  "gkx.workflows",
  "gkx.workflows.runtime",
]
required_docs = [
  "README.md",
]
target_domain_packages = [
  "gkx.physics",
  "gkx.geometry",
  "gkx.numerics",
  "gkx.solve",
  "gkx.optimize",
  "gkx.io",
]

[topology_policy]
mode = "no_regression_until_target"
description = "Track the consolidation plan without breaking current CI before files are moved. Counts must not increase beyond the audited baseline; final release can pass --require-topology-targets to enforce the target ceilings."

[[topology_policy.counts]]
name = "installable_source_python_files"
path = "src/gkx"
pattern = "*.py"
recursive = true
baseline = 220
target = 45

[[topology_policy.counts]]
name = "test_python_files"
path = "tests"
pattern = "*.py"
recursive = true
# 95 -> 96: tests/validation/physics_gates/test_objective_reports_stability.py.
# The target is 36, so a new file needs a reason: this one pins that the linear
# objective can report a design is stable at all. Without the closure it cannot
# -- at zero drive the whole spectrum sits on the imaginary axis and the branch
# selector is floored at zero -- and no existing test covered that, because
# every other objective test runs at a drive where something is unstable.
# 96 -> 97: tests/unit/solvers/test_dot_precision_guard.py. The target is 36, so
# a new file needs a reason: this one owns a hazard that has no home in any
# existing suite, because it is not a property of a value. An unpinned dot and
# Precision.HIGHEST are bit-identical on CPU, so nothing this repo's x64-only CI
# executes can observe TF32 -- the evidence lives in the jaxpr, and the assertion
# has to be about the precision request rather than the answer. It is one file
# rather than assertions scattered across the solver and geometry suites because
# the classifier is shared: the rule is shape-based, so a contraction that
# becomes a matrix product when a config value moves is caught without anyone
# editing a list of call sites. It also carries the single allowlisted unpinned
# contraction and the test that keeps that entry honest.
baseline = 97
target = 36

[[topology_policy.counts]]
name = "tool_python_files"
path = "tools"
pattern = "*.py"
recursive = true
baseline = 95
target = 0

[[topology_policy.counts]]
name = "developer_script_python_files"
path = "scripts"
pattern = "*.py"
recursive = true
baseline = 15
target = 12


[[topology_policy.counts]]
name = "flat_test_python_files"
path = "tests"
pattern = "*.py"
recursive = false
baseline = 1
target = 1

[[topology_policy.counts]]
name = "flat_tool_python_files"
path = "tools"
pattern = "*.py"
recursive = false
baseline = 0
target = 0

[complexity_policy]
mode = "no_regression_until_target"
description = "Prevent new giant modules while named legacy hotspots are reduced to reviewed domain budgets."
default_max_lines = 1000
public_facade_max_lines = 500
public_facades = [
  "api/__init__.py",
  "benchmarks.py",
  "linear.py",
  "nonlinear.py",
  "quasilinear.py",
  "runtime.py",
]

[[complexity_policy.exceptions]]
path = "artifacts/nonlinear_netcdf.py"
baseline_lines = 1069
target_lines = 1000
reason = "One NetCDF schema owner keeps dimensions, geometry, diagnostics, restart, and final-field variables consistent; reduce helper repetition without splitting the schema again."

[[complexity_policy.exceptions]]
path = "artifacts/io.py"
baseline_lines = 1088
target_lines = 1000
reason = "One runtime I/O owner keeps summaries, tables, restart packing, and diagnostic reload consistent; reduce repeated serializers without restoring format-specific modules."

[line_budget_policy]
mode = "no_regression_until_target"
description = "Track real code deletion rather than file reshuffling."

[[line_budget_policy.counts]]
name = "installable_source_python_lines"
path = "src/gkx"
pattern = "*.py"
recursive = true
# 88680 -> 88819: bounding adaptive-chunk memory (#24). Per-chunk striding with
# a carried phase, the npz spill path, and the stride offset argument. The change
# exists to *reduce* runtime memory by a factor of the diagnostics stride; these
# lines are what makes that possible without changing which samples are kept.
# 88819 -> 88907: naming the gradient parameters for what the operator consumes.
# The deprecation aliases keep R_over_L* working for external callers, which is
# the whole cost; the rename itself is line-neutral.
# 88907 -> 89356: making a nonlinear run report why it is slow (#33). The CFL
# scales the adaptive step already uses were discarded inside the traced dt
# update, so a straggler surface could only be diagnosed by a bespoke post-hoc
# script. Recording those six run constants and inverting the dt trajectory
# against them buys cost per unit of simulated time, the dt collapse ratio, and
# the per-term CFL attribution in the run's own summary.
# 89356 -> 89705: routing [parallel] into the nonlinear solver path (#35).
# The new workflows/runtime/parallel_nonlinear.py plus the workflow rework that
# makes one trajectory re-runnable so the sharded answer can be gated against
# the serial one. The bulk is not mechanism but refusal: every strategy/axis/
# backend combination the nonlinear path cannot execute raises with the reason
# and the supported set, because the alternative is the defect this removes --
# cfg.parallel accepted and silently ignored.
# 89705 -> 89710: closing the Laguerre truncation in the two sharded
# diamagnetic drives. Both built the upper gyroaverage neighbour by zero
# padding past the retained l, dropping the analytic boundary term the serial
# route carries; five lines buy the analytic neighbour in each route and the
# single-species b normalization they need to compute it.
# -> 89737: the linear objective's velocity-space closure (#30). Three
# closure fields, an optional geometry argument for kpar_scale, and the recorded
# reason the amplitudes must not go back to zero -- without it the objective
# cannot report a stable design. See test_objective_reports_stability.
# 89726 -> 89736: computing the device-z observable sums with the local fused
# transform. The transform swap is line-neutral; the ten lines are the docstring
# recording why axis-at-a-time staging is wrong here, which is the same reason
# #36 gave for the bracket. Without it the next reader restores the staging on
# the assumption that a route named "pencil" should stage its axes.
# 89736 -> 89724: retiring the staged pencil transforms _pencil_ifft2 and
# _pencil_fft2. #36 moved the device-z bracket to the fused transform and the
# observable sums above took the last caller, so the pair was reachable only
# from a round-trip assertion in tests. Deleting both drops 22 lines and returns
# 10 of them to the _pencil_spectral_bracket docstring, which now records why the
# staging is wrong for a z-partitioned slab and why the deleted code was not a
# usable starting point for a route that does partition a transform axis: it
# transposed with jnp.swapaxes, a device-local move, where that step has to be
# a collective.
# 89724 -> 89776: compensating the device-z transport observable reductions.
# jnp.sum was not enough: XLA lowers a reduction over a materialized array to a
# blocked vector reduction but lowers the same reduction fused into its
# elementwise producer -- which is what the sharded reducer gets inside its
# shard_map jit -- to a far longer accumulation chain. The bracket observable
# adds ~1e7 terms each ~5e-8 of the total, so in single precision that chain
# absorbed the whole identity budget and the sharded_reduce transport window
# failed at Ny = Nx = 96 while both neighbouring powers of two passed. The
# lines are the Neumaier pass and the two-stage driver that make the sums
# independent of which chain XLA emits. See
# test_observable_sums_survive_fused_reduction_at_a_mixed_radix_grid.
# 89726 -> 89739: pinning Precision.HIGHEST on the contractions that carry a
# physical invariant. XLA may satisfy an unpinned dot with TF32 on Ampere and later
# NVIDIA GPUs, keeping 10 mantissa bits; that broke particle/momentum/energy
# conservation in the collision operators at ~1e-4 and truncated the shearing remap
# -- a permutation of exact zeros and ones -- to 1e-3 of the state itself. Thirteen
# lines is the recorded reason, not mechanism: collisions.py routes its four
# contractions through one bound _exact_einsum so the pin cannot be forgotten at a
# call site, and the shearing remap says why a permutation must not be approximated.
# CPU has no TF32 path and cannot observe any of it, which is why the explanation
# lives in the source. See test_collision_contractions_pin_exact_dot_precision.
# 89726 -> 89752: src/gkx/utils/tomlcompat.py, the repository's only
# tomllib/tomli fallback. It has to live in the installable package because
# src reads TOML at runtime, and because putting it anywhere else leaves the
# per-file try/except that made twelve modules uncollectable on the declared
# 3.10 floor while every CI job ran 3.11. Net cost is 26 lines: the shim is 30
# and the guard it replaces in workflows/runtime/toml.py was 4. See
# test_tomllib_fallback_lives_only_in_the_shim.
# 89815 -> 89848: finishing the TF32 sweep across the solver and geometry paths
# #43 left. The audit measured every contraction in the package rather than
# assuming, and the answer narrowed the fix: XLA only reaches for the tensor
# cores when a contraction is matrix-shaped, so the Krylov vector work -- the
# Arnoldi Gram-Schmidt vdots, the Rayleigh quotients, the Ritz lift, the overlap
# einsums -- measured exact unpinned on an RTX A4000 and is deliberately left
# alone. Two products were not exact and are pinned here: the propagator
# candidate lift, which is a matvec at the default candidates=1 and a real GEMM
# above it (returned eigenvector 1.2e-08 -> 1.8e-05), and the Gauss-Newton normal
# equations, where squared conditioning puts 1.7e-04 into a step whose own report
# gates at rtol 1.0e-04. Most of the 33 lines are those two measurements written
# down, plus _damped_gauss_newton_step, which exists so the pin is reachable by a
# jaxpr assertion at all -- the loop around it converts to host floats to build
# its history and cannot be traced. See test_dot_precision_guard.py.
baseline = 89848
target = 45000

