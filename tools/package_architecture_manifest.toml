[metadata]
schema_version = 1
title = "Package architecture policy"
layout_authority = "README.md"
status = "active"

[root_prefix_policy]
blocked_prefixes = [
  "runtime_",
  "nonlinear_",
  "linear_",
  "solver_",
  "vmex_",
  "quasilinear_",
  "benchmark_",
  "stellarator_",
]
allowed_root_prefix_modules = []

[package_policy]
# Section 25c replaces the directory-shaped layout with flat modules. A package
# is required here only while it still holds more than a couple of modules;
# gkx.core held two (grid, velocity) and is now gkx/core_grid.py and
# gkx/core_velocity.py, so requiring the package would mandate an empty
# directory. Same for gkx.utils and gkx.benchmarking, which were never listed.
# The gkx.solvers tree went the same way: its package __init__ was one line of
# docstring over three subpackages, and linear, time and nonlinear are now flat
# modules that re-export from their flat siblings, so none of the four is a
# package any more.
required_domain_packages = [
  "gkx.artifacts",
  "gkx.diagnostics",
  "gkx.geometry",
  "gkx.objectives",
  "gkx.operators",
  "gkx.operators.linear",
  "gkx.operators.nonlinear",
  "gkx.parallel",
  "gkx.workflows",
  "gkx.workflows.runtime",
]
required_docs = [
  "README.md",
]
target_domain_packages = [
  "gkx.physics",
  "gkx.geometry",
  "gkx.numerics",
  "gkx.solve",
  "gkx.optimize",
  "gkx.io",
]

[topology_policy]
mode = "no_regression_until_target"
description = "Track the consolidation plan without breaking current CI before files are moved. Counts must not increase beyond the audited baseline; final release can pass --require-topology-targets to enforce the target ceilings."

[[topology_policy.counts]]
name = "installable_source_python_files"
path = "src/gkx"
pattern = "*.py"
recursive = true
# 220 -> 221: workflows/runtime/resolution.py, the deterministic minimum-grid
# estimator behind `gkx wout.nc --estimate`. It is a new file because it is a
# calibration owner, not more orchestration: the module carries the measured
# anisotropy->ky_max map from the 2026-08 resolution scan, and folding those
# constants into wout.py or startup.py would bury a fitted physics contract
# inside CLI plumbing that changes for unrelated reasons.
# 221 -> 199: evicting research-campaign governance from the installable
# package. Eight modules left src/gkx: the VMEC candidate/transport admission
# policies and their report builders, the reduced-portfolio promotion guard,
# the solver gradient gates, and the nonlinear turbulence-gradient evidence and
# replicate-manifest owners. Seven moved to tools/campaigns/, which is where the
# campaign that calls them already lives; objectives/solver_gradient_reports.py
# was deleted outright because every function in it forwarded, unchanged, to an
# implementation in another module and nothing but the gkx.api registry
# imported it. None of them was reachable from a run, a CLI command, or a
# solver path. The count also absorbs the slack main was already carrying.
# Report builders evicted to tools/campaigns: vmec_flux_tube_reports and
# vmec_state_sensitivity are parity and sensitivity REPORT owners, not solver
# geometry. They were reachable only through wrappers on the differentiable
# facade, so evicting them removes the wrappers, four lazy-registry names, and
# the dedicated coverage suites that existed only to cover them.
# 199 -> 195: removing Diffrax from the base product. The four
# solvers/time/diffrax_*.py owner modules are deleted; the coupled implicit
# owner (solvers/linear/implicit.py) is unaffected.
baseline = 193
target = 45

