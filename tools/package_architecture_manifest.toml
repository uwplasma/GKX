# seam they need, which reports the R^2 pair over the requested window so the
# channel is still chosen on fit quality. See
# test_auto_fit_signal_keeps_the_requested_runtime_window.
# 89874 -> 89919: merging the auto-window signal fix (#46) under the residual
# floor. Both land in the fit path; the count is the sum, not new surface.
# 89919 -> 90011: certifying the default linear branch alongside the residual
# floor it now uses (#52 over #47). The adaptive branch and its precision pin.
# 94302 -> 94771: merging the stationary-window fit (#56) onto main. The two
# auto-fit scorers already carry the fixed-window branch #46 added, so the
# branch's inlined per-channel copies collapse into that seam and into the
# shared scan candidate helper instead of standing beside them; the stationary
# selector reaches both by threading window_method through the same argument.
# 94771 -> 94775: the two imports the sharded Hermite route was missing. np is
# used in five places and _make_hermitian_projector in one, so these four lines
# turn five NameErrors into working code rather than adding surface.
# 94775 -> 94808: naming the comparison code in one reader instead of the
# plotting path. The dispatch is a registry so a second code's reader is a
# row rather than another branch in the figure code.
# 94808 -> 94966: making the gated GAM damping rate a measurement (item 2.9).
# The old branchwise-extrema fit read four hand-picked peaks, so one shallow
# extremum that the diagnostic output cadence happened to resolve swung it by
# 52 percent -- more than three times its own gate tolerance -- at identical
# physics. The lines are one estimator, period_rms_envelope: a sliding
# one-period RMS about the trace's own running mean, amplitude-weighted in the
# log, over a window stated in GAM periods rather than in samples or in a
# hard-coded absolute time. Every sample enters, so refining the cadence
# refines the quadrature of one continuum integral instead of changing which
# points are fitted; the measured spread over a factor-8 cadence span drops
# from 126 percent of the gate tolerance to 1 percent. The remaining lines are
# the two window bounds carried onto ZonalFlowResponseMetrics, because a gated
# damping rate whose window is derived rather than configured has to report the
# window it actually used. See
# test_period_rms_damping_is_independent_of_the_diagnostic_output_cadence.
# 94966 -> 94978: refusing to call a dead trace saturated. The relative SEM
# divides by a floor when the mean is zero, so every other gate passed on a
# flux that never left zero and truncated the run in its first chunk.
# 94978 -> 95031: reading host values with numpy instead of round-tripping
# through jnp. Inside a trace the round trip returns a tracer, so guards
# written that way answered yes unconditionally and the fast paths they
# selected went dead exactly where they pay.
# 95031 -> 95456: carrying converged state between related runs. The policy is
# the cost -- which points may seed which, when a seed is refused, and the
# exact rescaling that leaves a growth fit invariant.
# 95456 -> 95504: closing two gaps in the differentiable heat-flux window.
# Threading collision_operator through it is four lines and removes a silent
# physics change: integrate_nonlinear took a custom operator, the window did
# not, so a run saturated with collisions and then differentiated returned the
# derivative of a different model with no diagnostic. The rest is the
# divergence-knee guard -- one measured constant, one warning helper, and the
# keyword that lets a caller remeasure it. The warning is the cost of the
# window being usable past the point where it stops being a gradient; the
# alternative is a large, reproducible, meaningless number.
# 95456 -> 95478: closing the second half of the run-to-saturation defect. The
# zero-flux guard added in #68 is an absolute threshold on a quantity whose
# scale the deck chooses, so it covered a dead trace only when that trace
# happened to sit below it; a flat flux a few decades higher stopped a run in
# its first chunk at any amplitude. Two lines of that are the fix -- the
# degenerate autocorrelation return no longer reports a resolved correlation
# time, and "resolved" now means tau > 0 rather than tau >= 0, which is what
# stops the derived min_window = 10 tau from collapsing to zero on exactly the
# traces carrying no information. The rest is the comment saying why the
# absolute threshold cannot be the protection, so it is not restored as one.
# 95480 -> 95489: refusing to resolve a correlation time the sampling cannot
# see. A flat trace crossed zero at lag one, which read as resolved and
# collapsed the window floor built on it.
# 95504 -> 95537: merging the gradient coverage work over the deck audit.
# 95537 -> 95565: keeping the bracket out of the linear operator's fusion. The
# lines are the measurement: which fusion, on which shard shape, and why an
# identity is the right instrument for it.
# 95565 -> 95612: saying what a file is when it is not the TOML the CLI
# expected. The signature table is the cost; the alternative is a decode
# error against a byte offset, which names neither the file nor the problem.
# 95612 -> 96431: finishing the `gkx wout_XXX.nc` result set. Two thirds is the
