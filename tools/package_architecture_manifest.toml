# 76 -> 77: tests/validation/physics_gates/test_end_damping_physics.py. The
# target is 30, so a new file needs a reason: none of the four existing gates
# is about a dissipation term acting at the parallel-domain boundary -- they
# own the collision operators, the Hermite hierarchy, geometry contracts, and
# the gate machinery -- and filing a time-integration contract under any of
# them would misname it. It is also the file the end-damping redesign (#194)
# has to rewrite, and having it separate means that redesign does not have to
