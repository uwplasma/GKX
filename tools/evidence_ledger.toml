columns = { gamma_ref = "gamma_ref_last", gamma_gkx = "gamma_last", omega_ref = "omega_ref_last", omega_gkx = "omega_last" }
generator = "tools/benchmark_refresh_manifest.toml job 'imported-linear-hsx' -> tools/comparison/compare_gx_imported_linear.py"
reference = "GX output supplied through the unrecorded HSX_IMPORTED_ARGS environment variable"
reference_rank = 5
tier = 2
status = "provisional"
notes = "provenance corrected 2026-09-08. The generator is NOT tools/comparison/fixtures/parity/hsx_itg.toml, which the GX parity manifest names: that config declares y0=10, Nl=8, Nm=16 while the CSV is spaced dky=1/21 (y0=21) and the real pipeline uses runtime_hsx_nonlinear_vmec_geometry.toml at y0=21, Nl=4, Nm=8. The equilibrium is Nuhrenberg-Zille 1988 QHS, regenerable from the tracked examples/vmec/input.NuhrenbergZille_1988_QHS, and is not literally HSX despite the label. What is still unrecorded is the value of HSX_IMPORTED_ARGS, which carries the GX reference; the same gap applies to the W7-X row. Row stays provisional until that is recorded, not because the scan cannot be rebuilt."

