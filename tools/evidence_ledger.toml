# GKX evidence ledger
#
# One [[row]] per public number or claim. `tests/release/test_evidence_ledger.py`
# checks that every artifact and generator exists, that every row is
# well formed, and that each README number recomputes from its artifact.
#
# Contract (plan.md sections 3.1-3.2):
#   reference_rank  1 analytic
#                   2 published numbers
#                   3 reference-code goldens shipped in the reference code's tree
#                   4 open published dataset
#                   5 self-run comparator
#   tier            0 push, <60 s      1 push, bitwise on stored outputs
#                   2 nightly physics  3 campaign, GPU
#   status          open | passing | failing | provisional | superseded
#
# A claim cites the highest-ranked reference available. A self-run reference is
# labeled rank 5 and is never described as published.
#
# Linked-boundary GX references additionally record reference_index_count =
# Nz*Nl*Nm and reference_clamp_binds. GX launches dampEnds_linked with
# dG_all.z = min(65535, Nz*Nl*Nm) but, unlike linkedCopyBackAll and
# linkedAccumulateBackAll, that kernel has no grid-stride loop over z, so when
# the count exceeds 65535 the highest Hermite moments receive no end damping.
# See tools/comparison/fixtures/gx_goldens/README.md for the derivation.

schema_version = 1
updated = "2026-09-07"

