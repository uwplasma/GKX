# README figures regenerated by `python scripts/figures.py`.
#
# Each [[figure]] names its builder, its output under docs/_static/readme/ and
# the tracked inputs it reads. Builders read only tracked files or run a
# bounded computation (seconds to a few minutes on one CPU); none needs a GPU,
# GX or network access. Values that exist only as logged measurements are
# copied into the [measured.*] tables below with the plan/log.md section that
# records them, so each number in a figure has one citable source.

output_dir = "docs/_static/readme"
palette_colors = 128

[[figure]]
name = "linear"
builder = "linear"
output = "readme_linear.png"
inputs = [
  "docs/_static/cyclone_mismatch_table.csv",
  "docs/_static/w7x_linear_t2_scan.csv",
  "docs/_static/reference_modes/w7x_linear_gkx_ky0p3000.csv",
  "docs/_static/comparison/reference_modes/w7x_linear_reference_ky0p3000.npz",
  "docs/_static/reference_modes/w7x_eigenfunction_reference_overlay_ky0p3000.json",
  "docs/_static/kbm_mismatch_table.csv",
]

[[figure]]
name = "nonlinear"
builder = "nonlinear"
output = "readme_nonlinear.png"
inputs = [
  "docs/_static/external_vmec_circular_replicates/circular_replicate_t700_ensemble_gate.json",
  "docs/_static/nonlinear_cyclone_gate_summary.json",
  "docs/_static/nonlinear_cyclone_miller_gate_summary.json",
  "docs/_static/nonlinear_w7x_gate_summary.json",
  "docs/_static/nonlinear_hsx_gate_summary.json",
  "docs/_static/nonlinear_kbm_gate_summary.json",
]

[[figure]]
name = "proof_tests"
builder = "proof_tests"
output = "readme_proof_tests.png"
# Bounded runs: the collision matrices, the Laguerre transform and the
# collisionless Hermite spectrum take seconds; the Landau nu-scan is 2 x 8
# slab initial-value runs through GKX's production linear operator.
inputs = []

[[figure]]
name = "gx_defects"
builder = "gx_defects"
output = "readme_gx_defects.png"
inputs = ["plan/log.md", "tools/comparison/fixtures/gx_goldens/README.md"]

# ------------------------------------------------------------------ measured

# GX launches dampEnds_linked on dG_all.z = min(65535, Nz*Nl*Nm) without the
# grid-stride loop its sibling kernels carry (grad_parallel_linked.cu:169-173,
# device_funcs.cu:3149 at GX bc2fe552). The four shipped linked goldens run at
# Nz*Nl*Nm = 96*16*48 = 73,728; W7-X at 256*8*16 = 32,768.
[measured.gx_clamp]
launch_cap = 65535
goldens = [
  { label = "Cyclone s-alpha, Cyclone Miller (x2), KBM goldens", count = 73728 },
  { label = "W7-X golden", count = 32768 },
  { label = "Cyclone Nl32/Nm96 ladder", count = 294912 },
]
source = "tools/comparison/fixtures/gx_goldens/README.md; plan.md section 3.7"

# Cyclone s-alpha ITG, ky = 0.55, Nz 96, Nl 32, Nm 96, rate 50, T = 300.
# Both GX builds carry the normalized hypercollision power; only the second
# carries the dampEnds_linked grid-stride loop.
[measured.gx_clamp_growth]
ky = 0.55
gx_clamped_gamma = 0.023903807575570125
gx_clamped_omega = 0.5051693808381631
gx_clamped_source = "plan/log.md, '### Patched GX reference exit and audit' (2026-09-05)"
gx_repaired_gamma = 0.024908309636238253
gx_repaired_omega = 0.5049831325141155
gx_repaired_source = "plan/log.md, '### 2026-09-05: analytic scaled-congruence limits; repaired GX reference terminal'"
gkx_gamma = 0.02485209212445021
gkx_omega = 0.5049331701718064
gkx_source = "plan/log.md, matched GKX Nl32/Nm96 dt 0.001 / T 300 control in the same two entries"

# Actual-kernel harness linking GX's production device_funcs.o: number of
# damping-layer outputs that differ from the analytic profile.
[measured.gx_clamp_kernel]
index_counts = [6144, 73728, 294912]
wrong_original = [0, 1966, 54958]
wrong_repaired = [0, 0, 0]
source = "plan/log.md, '## 2026-09-05 — Actual GX kernel regression, isolated repair and corrected reference'"

# GX's kz hypercollision coefficient (linear.cu:232 and device_funcs.cu:3816 at
# bc2fe552) is nu_hyper_m*(p+1/2)/M^(p+1/2) * 2.3 * vt*|gradpar| times m^p, each
# power formed separately in float32; p_hyper_m defaults to min(20, Nm/2).
# An Nm = 96 GX run with this arithmetic wrote NaN fluxes from t = 0.202.
[measured.gx_hyper_overflow]
p_hyper_m = 20
nm_range = [40, 128]
nm_nan_run = 96
source = "plan/log.md, '## 2026-09-05 — High-Nm GX startup fails; reference hypercollision overflow found'"
