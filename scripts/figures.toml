[[figure]]
name = "analytic"
builder = "analytic"
output = "readme_analytic.png"
# Runs: scripts/artifacts/build_analytic_benchmarks.py (CPU hours, float64);
# specification: plan/research/2026-09-analytic-benchmarks/REPORT.md.
inputs = ["docs/_static/analytic_benchmarks.json"]

[analytic]
